<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Shotboard">
<title>Shotboard</title>
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' fill='%23F5F2EC'/%3E%3Crect x='38' y='52' width='104' height='76' fill='none' stroke='%23FF3B30' stroke-width='7'/%3E%3Cpath d='M62 90h56' stroke='%23FF3B30' stroke-width='7'/%3E%3Cpath d='M104 76l16 14-16 14' fill='none' stroke='%23FF3B30' stroke-width='7'/%3E%3C/svg%3E">
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

:root{
  --ink:#F5F2EC;
  --panel:#FFFFFF;
  --panel-2:#F2EEE7;
  --panel-3:#E9E4DA;
  --line:#E5DFD4;
  --line-2:#D2CABC;
  --text:#26211B;
  --dim:#8B8276;
  --faint:#B8AFA2;
  --mark:#FF3B30;
  --mark-soft:rgba(255,59,48,.10);
  --amber:#FFC24B;
  --done:#17A96B;
  --done-soft:rgba(23,169,107,.12);
  --sel:#3B82F6;
  --rail:58px;
  --sidebar:134px;
  --spring:cubic-bezier(.34,1.56,.64,1);
  --ease:cubic-bezier(.22,.61,.36,1);
  --r-sm:8px;
  --r-md:12px;
  --r-lg:16px;
}

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{
  background:var(--ink);color:var(--text);
  font-family:'Space Grotesk',system-ui,sans-serif;
  -webkit-user-select:none;user-select:none;
  touch-action:none;
}
button{font-family:inherit;color:inherit;background:none;border:none;cursor:pointer}
button:focus-visible{outline:2px solid var(--sel);outline-offset:2px}

@keyframes popIn{from{opacity:0;transform:scale(.9) translateY(4px)}to{opacity:1;transform:none}}
@keyframes slideUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes toastIn{0%{opacity:0;transform:translate(-50%,-10px) scale(.94)}60%{transform:translate(-50%,2px) scale(1.01)}100%{opacity:1;transform:translate(-50%,0) scale(1)}}
@keyframes viewIn{from{opacity:0;transform:translateX(16px)}to{opacity:1;transform:none}}
@keyframes viewInL{from{opacity:0;transform:translateX(-16px)}to{opacity:1;transform:none}}
@keyframes pulseDot{0%{transform:scale(.6);opacity:1}100%{transform:scale(1.5);opacity:0}}
@keyframes wiggle{0%,100%{transform:rotate(0)}30%{transform:rotate(-4deg)}60%{transform:rotate(3deg)}}

/* ---------- Shell ---------- */
#app{position:fixed;inset:0;display:flex;flex-direction:column}
.topbar{
  flex:0 0 auto;display:flex;align-items:center;gap:10px;
  padding:0 12px;padding-top:env(safe-area-inset-top);
  height:calc(58px + env(safe-area-inset-top));
  background:var(--panel);border-bottom:1px solid var(--line);
}
.brand{
  font-weight:700;font-size:14px;letter-spacing:-.02em;color:var(--text);
  display:flex;align-items:center;gap:6px;
}
.brand::before{
  content:'';width:9px;height:9px;border-radius:3px;background:var(--mark);
  box-shadow:0 0 10px rgba(255,59,48,.5);
}
.projname{
  font-size:13px;font-weight:500;color:var(--dim);
  max-width:26vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.spacer{flex:1}
.tbtn{
  font-size:12px;font-weight:600;letter-spacing:.01em;color:var(--dim);
  padding:7px 12px;border:1px solid var(--line);border-radius:10px;
  background:var(--panel-2);
  transition:transform .15s var(--spring),background .15s,color .15s;
}
.tbtn:active{background:var(--panel-2);color:var(--text);transform:scale(.94)}

.savedot{
  width:7px;height:7px;border-radius:50%;background:var(--faint);
  position:relative;flex:0 0 auto;transition:background .2s;
}
.savedot.on{background:var(--done)}
.savedot.on::after{
  content:'';position:absolute;inset:0;border-radius:50%;
  background:var(--done);animation:pulseDot .6s ease-out;
}

/* progress pill */
.prog{
  display:none;align-items:center;gap:7px;
  background:var(--panel-2);border:1px solid var(--line);
  border-radius:20px;padding:5px 11px 5px 8px;
}
.prog.on{display:flex}
.prog.full{border-color:rgba(61,214,140,.5);background:var(--done-soft)}
.progbar{width:44px;height:5px;border-radius:3px;background:var(--panel-3);overflow:hidden}
.progbar i{
  display:block;height:100%;width:0;border-radius:3px;
  background:linear-gradient(90deg,var(--amber),var(--done));
  transition:width .4s var(--ease);
}
.progtxt{
  font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:600;
  letter-spacing:.05em;color:var(--dim);
}
.prog.full .progtxt{color:var(--done)}

/* ---------- Mode switch ---------- */
.modesw{
  display:flex;gap:3px;background:var(--panel-2);
  border:1px solid var(--line);border-radius:15px;padding:4px;margin-left:2px;
  position:relative;
}
.mode{
  display:flex;align-items:center;gap:8px;
  font-size:13px;font-weight:700;letter-spacing:.02em;color:var(--dim);
  padding:10px 19px;border-radius:12px;
  transition:color .22s;position:relative;z-index:1;
}
.mode svg{
  width:15px;height:15px;fill:none;stroke:currentColor;
  stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;
}
.mode:active{transform:scale(.93)}
.mode.on{color:#fff}

.body{flex:1;display:flex;min-height:0}
.body.enter{animation:viewInL .26s var(--ease)}

/* ---------- Tool rail ---------- */
.rail{
  width:var(--rail);flex:0 0 var(--rail);
  background:var(--panel);border-right:1px solid var(--line);
  display:flex;flex-direction:column;align-items:center;
  padding:8px 0;gap:4px;overflow-y:auto;
}
.tool{
  width:44px;height:44px;border-radius:var(--r-md);
  display:flex;align-items:center;justify-content:center;
  color:var(--dim);position:relative;flex:0 0 auto;
  transition:transform .18s var(--spring),background .18s,color .18s;
}
.tool svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.85;stroke-linecap:round;stroke-linejoin:round}
.tool:active{transform:scale(.86)}
.tool.on{background:var(--mark-soft);color:var(--mark);animation:wiggle .3s var(--ease)}
.tool.mk.on{background:var(--done-soft);color:var(--done)}
.tool.on::before{
  content:'';position:absolute;left:-8px;top:12px;width:3.5px;height:20px;
  border-radius:0 4px 4px 0;background:var(--mark);
}
.tool.mk.on::before{background:var(--done)}
.tool.dim{color:#DAD3C6;pointer-events:none}
#btnTrash.live{color:var(--mark)}
.raildiv{width:26px;height:1px;background:var(--line);margin:5px 0;flex:0 0 auto}
.tool[data-badge]::after{
  content:attr(data-badge);position:absolute;bottom:2px;left:0;right:0;
  font-family:'IBM Plex Mono',monospace;font-size:7.5px;font-weight:600;
  letter-spacing:.06em;text-align:center;color:var(--faint);
}
.tool.on[data-badge]::after{color:var(--mark)}
.tool[data-badge] svg{margin-bottom:6px}

/* ---------- Pages sidebar ---------- */
.pages{
  flex:0 0 var(--sidebar);width:var(--sidebar);
  background:var(--panel);border-right:1px solid var(--line);
  display:flex;flex-direction:column;overflow:hidden;
  transition:flex-basis .28s var(--ease),width .28s var(--ease),border-color .28s;
}
.pages.closed{flex-basis:0;width:0;border-right-color:transparent}
.pages.hide{display:none}
.pages .pagelist,.pages .pagehead{min-width:calc(var(--sidebar) - 1px)}
.pages .addpage{min-width:calc(var(--sidebar) - 19px);width:calc(var(--sidebar) - 19px)}

.pagetoggle{
  position:absolute;left:0;top:50%;transform:translateY(-50%);
  width:22px;height:58px;border-radius:0 12px 12px 0;
  background:var(--panel);border:1px solid var(--line);border-left:none;
  display:flex;align-items:center;justify-content:center;
  color:var(--dim);z-index:5;
  transition:color .18s,width .18s var(--spring);
  box-shadow:3px 0 12px rgba(30,24,17,.10);
}
.pagetoggle svg{
  width:15px;height:15px;fill:none;stroke:currentColor;
  stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round;
  transition:transform .28s var(--spring);
}
.pagetoggle:active{color:var(--mark);width:26px}
.pagetoggle.flip svg{transform:rotate(180deg)}
.pagehead{
  padding:10px 12px 8px;font-size:11px;font-weight:700;
  letter-spacing:.1em;text-transform:uppercase;color:var(--faint);
  border-bottom:1px solid var(--line);
}
.pagelist{flex:1;overflow-y:auto;padding:9px;display:flex;flex-direction:column;gap:9px;-webkit-overflow-scrolling:touch;touch-action:pan-y}
.thumb{
  position:relative;border-radius:var(--r-sm);overflow:hidden;
  border:1.5px solid var(--line);background:var(--panel-2);
  transition:border-color .2s,transform .2s var(--spring);
  animation:popIn .25s var(--ease) backwards;
}
.thumb.act{border-color:var(--mark);box-shadow:0 0 0 1px rgba(255,59,48,.25),0 4px 14px rgba(30,24,17,.10)}
.thumb.drag{opacity:.35;transform:scale(.96)}
.thumb canvas{display:block;width:100%;height:auto;background:#fff}
.thumbn{
  position:absolute;left:5px;top:5px;
  font-family:'IBM Plex Mono',monospace;font-size:9px;font-weight:600;
  padding:2px 6px;border-radius:5px;
  background:rgba(18,15,13,.82);color:var(--text);max-width:calc(100% - 34px);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.thumbx,.thumbe{
  position:absolute;width:20px;height:20px;border-radius:6px;
  background:rgba(18,15,13,.82);color:var(--dim);
  font-size:12px;line-height:20px;text-align:center;
  transition:color .15s;
}
.thumbx{right:4px;top:4px}
.thumbe{right:4px;bottom:8px;font-size:10px}
.thumbx:active,.thumbe:active{color:var(--text)}
.thumbbar{
  position:absolute;left:0;right:0;bottom:0;height:4px;background:rgba(18,15,13,.5);
}
.thumbbar i{
  display:block;height:100%;width:0;
  background:linear-gradient(90deg,var(--amber),var(--done));
  transition:width .35s var(--ease);
}
.addpage{
  margin:2px 9px 10px;padding:11px;border:1.5px dashed var(--line-2);border-radius:var(--r-sm);
  font-size:11px;font-weight:700;letter-spacing:.06em;
  text-transform:uppercase;color:var(--dim);text-align:center;
  transition:all .18s var(--spring);
}
.addpage:active{color:var(--mark);border-color:var(--mark);transform:scale(.96)}

/* ---------- Canvas ---------- */
.stage{flex:1;position:relative;background:#ECE7DD;overflow:hidden;min-width:0}
#board{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}

/* ---------- Options bar ---------- */
.opts{
  position:absolute;left:76px;right:14px;bottom:14px;
  bottom:calc(14px + env(safe-area-inset-bottom));
  display:flex;align-items:center;gap:5px;
  background:rgba(255,255,255,.94);backdrop-filter:blur(16px);
  border:1px solid var(--line);border-radius:var(--r-lg);padding:6px;
  overflow-x:auto;scrollbar-width:none;justify-content:flex-start;
  -webkit-overflow-scrolling:touch;touch-action:pan-x;
  animation:slideUp .24s var(--ease);
  box-shadow:0 8px 28px rgba(30,24,17,.12);
}
.opts::-webkit-scrollbar{display:none}
.opts.hide{display:none}
.opt{
  font-size:11.5px;font-weight:600;letter-spacing:.01em;color:var(--dim);
  white-space:nowrap;padding:8px 11px;border-radius:10px;flex:0 0 auto;
  transition:all .16s var(--spring);
}
.opt:active{transform:scale(.92)}
.opt.on{background:var(--panel-3);color:var(--text);box-shadow:inset 0 0 0 1px var(--line-2)}
.opt.del{color:var(--mark);box-shadow:inset 0 0 0 1px rgba(255,59,48,.35)}
.optlab{
  font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--faint);padding-left:6px;flex:0 0 auto;
}
.optdiv{width:1px;height:18px;background:var(--line);flex:0 0 auto;margin:0 2px}

/* ---------- Undo / redo ---------- */
.ur{
  position:absolute;left:14px;bottom:14px;
  bottom:calc(14px + env(safe-area-inset-bottom));
  display:flex;align-items:center;
  background:rgba(255,255,255,.94);backdrop-filter:blur(16px);
  border:1px solid var(--line);border-radius:var(--r-lg);padding:4px;
  box-shadow:0 8px 28px rgba(30,24,17,.12);
}
.ur.tl{bottom:auto;top:14px}
.urgrip{
  width:18px;align-self:stretch;display:flex;align-items:center;justify-content:center;
  color:var(--faint);font-size:14px;cursor:grab;
  touch-action:none;-webkit-user-select:none;user-select:none;
}
.urgrip:active{cursor:grabbing;color:var(--dim)}
.urb{
  width:44px;height:40px;border-radius:11px;
  display:flex;align-items:center;justify-content:center;color:var(--text);
  transition:transform .16s var(--spring),background .16s;
}
.urb svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.urb:active{background:var(--panel-2);transform:scale(.88)}
.urb.off{color:#DAD3C6;pointer-events:none}
.urdiv{width:1px;height:20px;background:var(--line)}

/* ---------- Empty state ---------- */
.empty{
  position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:14px;pointer-events:none;padding:24px;
}
.empty.hide{display:none}
.emptyt{
  font-size:14px;font-weight:500;color:var(--faint);
  text-align:center;line-height:1.8;
}
.emptycta{
  pointer-events:auto;padding:11px 18px;border-radius:12px;
  background:var(--mark);color:#fff;font-size:13px;font-weight:700;
  transition:transform .18s var(--spring);
  box-shadow:0 6px 20px rgba(255,59,48,.3);
}
.emptycta:active{transform:scale(.94)}

.toast{
  position:fixed;left:50%;transform:translateX(-50%);
  top:calc(70px + env(safe-area-inset-top));
  background:var(--panel-3);border:1px solid var(--line-2);border-radius:11px;
  padding:9px 16px;font-size:12.5px;font-weight:600;letter-spacing:.01em;
  z-index:80;opacity:0;pointer-events:none;
  box-shadow:0 8px 24px rgba(30,24,17,.14);
}
.toast::before{
  content:'';display:inline-block;width:7px;height:7px;border-radius:50%;
  background:var(--amber);margin-right:9px;vertical-align:1px;
}
.toast.on{opacity:1;animation:toastIn .3s var(--spring)}

/* ---------- Sheets / modals ---------- */
.scrim{
  position:fixed;inset:0;background:rgba(30,24,17,.4);
  display:none;align-items:center;justify-content:center;z-index:50;padding:20px;
}
.scrim.on{display:flex}
.sheet{
  background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);
  width:100%;max-width:440px;max-height:78vh;display:flex;flex-direction:column;
  animation:popIn .24s var(--spring);
  box-shadow:0 20px 60px rgba(30,24,17,.18);
}
.sheethead{
  padding:15px 16px;border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:10px;
}
.sheettitle{font-size:15px;font-weight:700;letter-spacing:-.01em}
.sheetbody{padding:12px;overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y}
.prow{
  display:flex;align-items:center;gap:10px;padding:13px;
  border:1px solid var(--line);border-radius:var(--r-md);margin-bottom:8px;
  transition:border-color .18s,transform .18s var(--spring);
}
.prow:active{border-color:var(--mark);transform:scale(.985)}
.pmeta{flex:1;min-width:0}
.pname{font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.psub{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--dim);margin-top:3px;letter-spacing:.04em}
.px{width:30px;height:30px;border-radius:8px;color:var(--dim);font-size:15px;flex:0 0 auto;transition:color .15s}
.px:active{color:var(--text)}
.cta{
  width:100%;padding:13px;border-radius:var(--r-md);background:var(--mark);color:#fff;
  font-size:13.5px;font-weight:700;letter-spacing:.01em;
  transition:transform .18s var(--spring);
  box-shadow:0 4px 16px rgba(255,59,48,.25);
}
.cta:active{transform:scale(.97)}
.cta.ghost{background:none;border:1px solid var(--line);color:var(--text);box-shadow:none}
input[type=text]{
  width:100%;padding:12px;border-radius:var(--r-md);background:var(--ink);
  border:1px solid var(--line);color:var(--text);font-size:15px;font-family:inherit;
  -webkit-user-select:text;user-select:text;
}
input[type=text]:focus{outline:none;border-color:var(--mark)}

.meter{margin-top:12px;padding:12px;border:1px solid var(--line);border-radius:var(--r-md)}
.meterlab{
  display:flex;justify-content:space-between;
  font-family:'IBM Plex Mono',monospace;font-size:10px;
  color:var(--dim);letter-spacing:.05em;margin-bottom:7px;
}
.meterbar{height:6px;border-radius:3px;background:var(--panel-2);overflow:hidden}
.meterbar i{display:block;height:100%;background:linear-gradient(90deg,var(--done),var(--amber));border-radius:3px}
.meterbar i.hot{background:linear-gradient(90deg,var(--amber),var(--mark))}

/* ---------- Inspo ---------- */
.inspo{flex:1;display:none;flex-direction:column;min-height:0;background:var(--ink);position:relative}
.inspo.on{display:flex;animation:viewIn .26s var(--ease)}
.inspobar{
  display:flex;align-items:center;gap:9px;padding:10px 12px;
  border-bottom:1px solid var(--line);background:var(--panel);
}
.inspocount{
  font-family:'IBM Plex Mono',monospace;font-size:10px;
  letter-spacing:.1em;text-transform:uppercase;color:var(--faint);
}
.viewsw{
  display:flex;gap:3px;background:var(--panel-2);
  border:1px solid var(--line);border-radius:15px;padding:4px;
  position:relative;
}
.vsw{
  font-size:13px;font-weight:700;letter-spacing:.03em;color:var(--dim);
  padding:10px 19px;border-radius:12px;transition:color .2s;
  position:relative;z-index:1;
}
.vsw.on{color:#3A2C10}
.crumb{
  display:none;align-items:center;gap:10px;padding:9px 12px;
  border-bottom:1px solid var(--line);background:var(--panel);
}
.crumb.on{display:flex}
.crumbback{
  font-size:12px;font-weight:600;color:var(--dim);
  padding:6px 10px;border-radius:8px;border:1px solid var(--line);
  transition:transform .15s var(--spring);
}
.crumbback:active{color:var(--text);transform:scale(.94)}
.crumbname{font-size:15px;font-weight:700;letter-spacing:-.01em}

.inspogrid{
  flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;
  padding:12px;padding-bottom:calc(20px + env(safe-area-inset-bottom));
  display:flex;align-items:flex-start;gap:11px;
}
.mcol{flex:1;min-width:0;display:flex;flex-direction:column;gap:11px}
.icell{
  position:relative;display:block;width:100%;
  border-radius:var(--r-lg);overflow:hidden;
  background:var(--panel);border:1px solid var(--line);
  box-shadow:0 1px 4px rgba(30,24,17,.06);
  transition:transform .2s var(--spring),border-color .2s,box-shadow .2s;
}
.icell.pop{animation:popIn .3s var(--ease) backwards}
.icell img{width:100%;height:auto;display:block}
.icell:hover{box-shadow:0 6px 18px rgba(30,24,17,.12)}
.icell:active{border-color:var(--mark);transform:scale(.97)}
.icell.drag{opacity:.35;transform:scale(.94)}
.icellx{
  position:absolute;right:6px;top:6px;width:26px;height:26px;border-radius:50%;
  background:rgba(255,255,255,.5);backdrop-filter:blur(8px);
  color:rgba(38,33,27,.55);font-size:13px;line-height:26px;text-align:center;
  opacity:.55;transition:all .18s var(--ease);
}
@media (hover:hover){
  .icellx:hover{background:var(--mark);color:#fff;opacity:1;transform:scale(1.08)}
}
.icellx:active{background:var(--mark);color:#fff;opacity:1}
.iroom{
  position:absolute;left:6px;bottom:6px;max-width:calc(100% - 44px);
  font-size:10px;font-weight:700;letter-spacing:.02em;
  padding:4px 10px;border-radius:20px;
  background:rgba(255,255,255,.68);backdrop-filter:blur(8px);
  color:#8A6300;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  transition:all .18s var(--ease);
}
.iroom.none{color:rgba(38,33,27,.4);background:rgba(255,255,255,.45)}
@media (hover:hover){
  .iroom:hover{background:rgba(255,255,255,.95);color:#6E4E00}
}
.inspoempty{
  position:absolute;inset:0;top:100px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:12px;padding:24px;
}
.inspoempty.hide{display:none}

/* column stepper */
.colctl{
  display:flex;align-items:center;gap:2px;
  background:var(--panel-2);border:1px solid var(--line);
  border-radius:11px;padding:3px;
}
.colb{
  width:32px;height:30px;border-radius:8px;font-size:17px;font-weight:700;
  color:var(--dim);transition:all .15s var(--spring);
}
.colb:active{background:var(--panel);color:var(--text);transform:scale(.9)}
.coln{
  font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:600;
  width:22px;text-align:center;color:var(--text);
}

/* rooms */
.roomwrap{
  flex:1;display:none;flex-direction:column;min-height:0;
  overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;
  padding:11px;padding-bottom:calc(24px + env(safe-area-inset-bottom));
}
.roomwrap.on{display:flex}
.roomgrid{
  display:grid;grid-template-columns:repeat(3,1fr);
  gap:10px;align-content:start;
}
.room{
  border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden;
  background:var(--panel);position:relative;
  transition:transform .2s var(--spring),border-color .2s,box-shadow .2s;
  animation:popIn .3s var(--ease) backwards;
}
.room:active{border-color:var(--mark);transform:scale(.97)}
.roomprev{
  display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;
  gap:1px;aspect-ratio:4/3;background:var(--line);
}
.roomprev div{background:var(--panel-2);overflow:hidden}
.roomprev img{width:100%;height:100%;object-fit:cover;display:block}
.roomfoot{padding:10px 11px;display:flex;align-items:center;gap:8px}
.roomname{font-size:13.5px;font-weight:700;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.roomn{
  font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:600;
  color:var(--ink);background:var(--amber);
  padding:2px 7px;border-radius:9px;flex:0 0 auto;
}
.roomx{
  position:absolute;right:6px;top:6px;width:26px;height:26px;border-radius:50%;
  background:rgba(255,255,255,.5);backdrop-filter:blur(8px);
  color:rgba(38,33,27,.55);font-size:12px;line-height:26px;text-align:center;
  opacity:.55;transition:all .18s var(--ease);
}
@media (hover:hover){
  .roomx:hover{background:var(--mark);color:#fff;opacity:1;transform:scale(1.08)}
}
.roomx:active{background:var(--mark);color:#fff;opacity:1}
.addroom{
  margin-top:11px;padding:14px;border:1.5px dashed var(--line-2);border-radius:var(--r-md);
  font-size:12px;font-weight:700;letter-spacing:.05em;
  text-transform:uppercase;color:var(--dim);
  transition:all .18s var(--spring);
}
.addroom:active{color:var(--mark);border-color:var(--mark);transform:scale(.98)}

.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{
  font-size:12.5px;font-weight:600;padding:9px 13px;border-radius:10px;
  border:1px solid var(--line);color:var(--dim);
  transition:all .16s var(--spring);
}
.chip:active{transform:scale(.93)}
.chip.on{border-color:var(--mark);color:var(--text);background:var(--mark-soft)}

/* ---------- Lightbox ---------- */
.lightbox{
  position:fixed;inset:0;background:#F6F3ED;z-index:70;
  display:none;align-items:center;justify-content:center;
}
.lightbox.on{display:flex}
.lbtrack{
  position:absolute;top:0;bottom:0;left:0;width:300%;
  display:flex;align-items:center;will-change:transform;
}
.lbtrack.anim{transition:transform .32s var(--ease)}
.lbslide{
  flex:0 0 33.3333%;height:100%;
  display:flex;align-items:center;justify-content:center;
  padding:0 10px;
}
.lbslide img{max-width:100%;max-height:92%;object-fit:contain;display:block;border-radius:12px;box-shadow:0 18px 50px rgba(30,24,17,.28),0 4px 14px rgba(30,24,17,.14)}
.lbbar{
  position:absolute;left:50%;transform:translateX(-50%);
  bottom:calc(20px + env(safe-area-inset-bottom));
  display:flex;align-items:center;gap:4px;
  background:rgba(255,255,255,.96);backdrop-filter:blur(16px);
  border:1px solid var(--line);border-radius:var(--r-lg);padding:5px;
  box-shadow:0 10px 30px rgba(30,24,17,.16);
}
.lbb{
  width:48px;height:40px;border-radius:12px;font-size:22px;line-height:1;color:var(--text);
  transition:transform .15s var(--spring),background .15s;
}
.lbb:active{background:var(--panel-2);transform:scale(.9)}
.lbpos{
  font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:600;
  color:var(--dim);min-width:58px;text-align:center;letter-spacing:.06em;
}
.lbclose{
  position:absolute;right:14px;top:calc(14px + env(safe-area-inset-top));
  width:40px;height:40px;border-radius:12px;font-size:16px;
  box-shadow:0 4px 14px rgba(30,24,17,.14);
  background:rgba(255,255,255,.96);border:1px solid var(--line);color:var(--text);
  transition:transform .15s var(--spring);
}
.lbclose:active{transform:scale(.9)}
.lbdel{
  position:absolute;left:14px;top:calc(14px + env(safe-area-inset-top));
  padding:10px 15px;border-radius:11px;font-size:12px;font-weight:700;
  box-shadow:0 4px 14px rgba(30,24,17,.14);
  background:rgba(255,255,255,.96);border:1px solid rgba(255,59,48,.4);color:var(--mark);
}
.lbsend{
  position:absolute;left:14px;top:calc(64px + env(safe-area-inset-top));
  padding:10px 15px;border-radius:11px;font-size:12px;font-weight:700;
  box-shadow:0 4px 14px rgba(30,24,17,.14);
  background:rgba(255,255,255,.96);border:1px solid var(--line);color:var(--text);
}
.lbroom{
  position:absolute;left:14px;top:calc(114px + env(safe-area-inset-top));
  padding:10px 15px;border-radius:11px;font-size:12px;font-weight:700;
  background:rgba(255,255,255,.96);border:1px solid rgba(202,142,20,.55);color:#9A6A00;
  box-shadow:0 4px 14px rgba(30,24,17,.14);
}

/* ---------- Links ---------- */
.linkwrap{
  flex:1;display:none;flex-direction:column;min-height:0;
  overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;
  padding:11px;padding-bottom:calc(24px + env(safe-area-inset-bottom));
}
.linkwrap.on{display:flex}
.linkgrid{
  display:grid;grid-template-columns:repeat(3,1fr);
  gap:10px;align-content:start;
}
.linkcard{
  border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden;
  background:var(--panel);position:relative;text-align:left;
  transition:transform .2s var(--spring),border-color .2s;
  animation:popIn .3s var(--ease) backwards;
}
.linkcard:active{border-color:var(--mark);transform:scale(.97)}
.lthumb{
  aspect-ratio:16/9;background:var(--panel-2);position:relative;
  display:flex;align-items:center;justify-content:center;overflow:hidden;
}
.lthumb img{width:100%;height:100%;object-fit:cover;display:block}
.lplat{
  position:absolute;left:7px;top:7px;
  font-family:'IBM Plex Mono',monospace;font-size:9px;font-weight:600;
  letter-spacing:.08em;text-transform:uppercase;
  padding:4px 9px;border-radius:20px;
  background:rgba(255,255,255,.72);backdrop-filter:blur(8px);color:#8A6300;
}
.lfallback{font-size:30px;opacity:.4}
.lmeta{padding:10px 11px 11px}
.ltitle{
  font-size:13px;font-weight:600;line-height:1.35;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}
.lurl{
  font-family:'IBM Plex Mono',monospace;font-size:9.5px;color:var(--faint);
  margin-top:5px;letter-spacing:.03em;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.lx,.le{
  position:absolute;width:26px;height:26px;border-radius:50%;
  background:rgba(255,255,255,.5);backdrop-filter:blur(8px);
  color:rgba(38,33,27,.55);font-size:12px;line-height:26px;text-align:center;
  opacity:.55;transition:all .18s var(--ease);
}
@media (hover:hover){
  .lx:hover{background:var(--mark);color:#fff;opacity:1;transform:scale(1.08)}
  .le:hover{background:#fff;color:var(--text);opacity:1;transform:scale(1.08)}
}
.lx:active{background:var(--mark);color:#fff;opacity:1}
.le:active{background:#fff;color:var(--text);opacity:1}
.lx{right:6px;top:6px}
.le{right:38px;top:6px;font-size:11px}

/* refs panel */
.refs{
  flex:0 0 210px;width:210px;
  background:var(--panel);border-left:1px solid var(--line);
  display:flex;flex-direction:column;overflow:hidden;
  transition:flex-basis .28s var(--ease),width .28s var(--ease),border-color .28s;
}
.refs.closed{flex-basis:0;width:0;border-left-color:transparent}
.refs .pagehead,.refs .refslist,.refs .refsbtns{min-width:calc(210px - 1px)}
.refslist{
  flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;
  padding:9px;display:flex;flex-direction:column;gap:9px;
}
.refitem{
  position:relative;border:1px solid var(--line);border-radius:9px;overflow:hidden;
  background:var(--panel-2);animation:popIn .25s var(--ease) backwards;
}
.refitem img{width:100%;height:auto;display:block}
.refx{
  position:absolute;right:5px;top:5px;width:24px;height:24px;border-radius:50%;
  background:rgba(255,255,255,.5);backdrop-filter:blur(8px);
  color:rgba(38,33,27,.55);font-size:12px;line-height:24px;text-align:center;
  opacity:.55;transition:all .18s var(--ease);
}
.refx:active{background:var(--mark);color:#fff;opacity:1}
.refsbtns{display:flex;gap:7px;padding:9px}
.refsbtn{
  flex:1;padding:10px 4px;border:1.5px dashed var(--line-2);border-radius:9px;
  font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;
  color:var(--dim);transition:all .18s var(--spring);
}
.refsbtn:active{color:var(--mark);border-color:var(--mark);transform:scale(.96)}
.reftoggle{
  position:absolute;right:0;top:50%;transform:translateY(-50%);
  width:22px;height:58px;border-radius:12px 0 0 12px;
  background:var(--panel);border:1px solid var(--line);border-right:none;
  display:flex;align-items:center;justify-content:center;
  color:var(--dim);z-index:5;
  box-shadow:-3px 0 12px rgba(30,24,17,.10);
}
.reftoggle svg{
  width:15px;height:15px;fill:none;stroke:currentColor;
  stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round;
  transition:transform .28s var(--spring);
}
.reftoggle.flip svg{transform:rotate(180deg)}
.refpick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.refpick img{
  width:100%;height:88px;object-fit:cover;display:block;
  border-radius:8px;border:2.5px solid transparent;
}
.refpick img.on{border-color:var(--mark)}

/* liquid sliding pill */
.liq{
  position:absolute;top:4px;bottom:4px;left:0;width:0;
  border-radius:11px;z-index:0;
  transition:left .3s var(--spring),width .3s var(--spring);
}
.modesw .liq{
  background:linear-gradient(135deg,var(--mark) 0%,#FF6B5A 100%);
  box-shadow:0 3px 14px rgba(255,59,48,.35),inset 0 1px 0 rgba(255,255,255,.2);
}
.viewsw .liq{
  background:linear-gradient(135deg,var(--amber) 0%,#FFD37A 100%);
  box-shadow:0 3px 12px rgba(255,194,75,.4),inset 0 1px 0 rgba(255,255,255,.3);
}

@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}
</style>

<script>
'use strict';

/* ==========================================================
   Storage
   ========================================================== */
const DB='shotboard.v1';
const APP_VER='v9';
let S={projects:[],cur:null};

function load(){
  if(!S.projects||!S.projects.length){
    try{const r=localStorage.getItem(DB);if(r)S=JSON.parse(r);}catch(e){}
  }
  if(!S.projects||!S.projects.length){
    const p=newProject('Untitled project');
    S.projects=[p];S.cur=p.id;
  }
  S.projects.forEach(p=>{
    if(!p.inspo)p.inspo=[];
    if(!p.links)p.links=[];
    p.pages.forEach(pg=>{
      if(!pg.refs)pg.refs=[];
      pg.items.forEach(it=>{
        if(it.color==='#E4533A'||it.color==='#FF6B4A')it.color='#FF3B30';
      });
    });
    if(!p.rooms)p.rooms=DEFAULT_ROOMS.slice();
    p.inspo=p.inspo.map(x=>typeof x==='string'?{id:uid(),src:x,room:null}:x);
    p.inspo.forEach(x=>{if(!x.id)x.id=uid();if(x.room===undefined)x.room=null;});
  });
  if(!S.projects.find(p=>p.id===S.cur))S.cur=S.projects[0].id;
}
let saveT=null,noHist=false;
function save(){
  if(!noHist&&typeof commit==='function'&&hist.length)commit();
  clearTimeout(saveT);
  saveT=setTimeout(()=>{
    const flash=()=>{
      const d=document.getElementById('saveDot');
      if(d){d.classList.remove('on');void d.offsetWidth;d.classList.add('on');
        clearTimeout(d._t);d._t=setTimeout(()=>d.classList.remove('on'),900);}
    };
    const json=JSON.stringify(S);
    if(window.__idbOK){
      idbSet('state',json).then(flash)
        .catch(()=>toast('Could not save — export a backup now'));
    }else{
      try{localStorage.setItem(DB,json);flash();}
      catch(e){toast('Storage full — export and remove old projects');}
    }
  },260);
}

function newPage(){return{id:uid(),items:[],view:{x:0,y:0,z:1},refs:[]};}

/* ---- Undo / redo (per page, snapshot-based) ---- */
let hist=[],hpos=-1;
const snap=()=>JSON.stringify(page().items);
function histInit(){hist=[snap()];hpos=0;syncUndo();}
function commit(){
  const s=snap();
  if(hist[hpos]===s)return;
  hist=hist.slice(0,hpos+1);
  hist.push(s);
  if(hist.length>60)hist.shift();
  hpos=hist.length-1;
  syncUndo();
}
function undo(){
  if(hpos<=0)return;
  hpos--;
  page().items=JSON.parse(hist[hpos]);
  sel=null;noHist=true;save();noHist=false;draw();renderThumbs();syncEmpty();showOpts();syncUndo();
}
function redo(){
  if(hpos>=hist.length-1)return;
  hpos++;
  page().items=JSON.parse(hist[hpos]);
  sel=null;noHist=true;save();noHist=false;draw();renderThumbs();syncEmpty();showOpts();syncUndo();
}
function syncUndo(){
  const u=document.getElementById('btnUndo'),r=document.getElementById('btnRedo');
  if(!u)return;
  u.classList.toggle('off',hpos<=0);
  r.classList.toggle('off',hpos>=hist.length-1);
}
let pageIdx=0;
const page=()=>{const p=proj();if(pageIdx>=p.pages.length)pageIdx=p.pages.length-1;return p.pages[pageIdx];};

let opt={ratio:'3:2',dash:true,grid:false,weight:3,size:16,style:0,fmm:14,sensor:'apsc'};
const FOCALS_APSC=[10,14,18,23,35];      // Sony 10-18 zoom stops + 23 + 35 primes
const FOCALS_FF=[16,24,35,50,85];
const focalList=sn=>sn==='ff'?FOCALS_FF:FOCALS_APSC;
const snapFocal=(mm,sn)=>{
  const FL=focalList(sn);
  return FL.includes(mm)?mm:FL.reduce((a,b)=>Math.abs(b-mm)<Math.abs(a-mm)?b:a);
};

/* ==========================================================
   View transform
   ========================================================== */
const view=()=>page().view;
function toWorld(px,py){const v=view();return{x:(px-v.x)/v.z,y:(py-v.y)/v.z};}
function toScreen(wx,wy){const v=view();return{x:wx*v.z+v.x,y:wy*v.z+v.y};}

function resize(){
  const r=document.getElementById('stage').getBoundingClientRect();
  DPR=Math.min(window.devicePixelRatio||1,2.5);
  W=r.width;H=r.height;
  cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);
  if(typeof fxResize==='function')fxResize();
  draw();
}

/* ==========================================================
   Images
   ========================================================== */
function getImg(src,cb){
  if(imgCache[src]){cb&&cb(imgCache[src]);return imgCache[src];}
  const im=new Image();
  im.onload=()=>{imgCache[src]=im;draw();renderThumbs();cb&&cb(im);};
  im.src=src;
  return null;
}

document.getElementById('btnImg').onclick=()=>document.getElementById('fileIn').click();
document.getElementById('emptyAdd').onclick=()=>document.getElementById('fileIn').click();
document.getElementById('fileIn').onchange=async e=>{
  const files=[...e.target.files];
  e.target.value='';
  let ox=0;
  for(const f of files){
    try{
      const data=await shrink(f,1700);
      const im=new Image();
      await new Promise(res=>{im.onload=res;im.onerror=res;im.src=data;});
      imgCache[data]=im;
      const scale=Math.min(760/im.width,560/im.height,1);
      const c=toWorld(W/2,H/2);
      page().items.push({
        id:uid(),t:'img',src:data,
        x:c.x-im.width*scale/2+ox, y:c.y-im.height*scale/2+ox,
        w:im.width*scale, h:im.height*scale, lock:true
      });
      ox+=26;
    }catch(err){toast('Could not load image');}
  }
  save();draw();renderThumbs();syncEmpty();
};

function shrink(file,max){
  return new Promise((res,rej)=>{
    const fr=new FileReader();
    fr.onerror=rej;
    fr.onload=()=>{
      const im=new Image();
      im.onerror=rej;
      im.onload=()=>{
        let{width:w,height:h}=im;
        const s=Math.min(max/w,max/h,1);
        w=Math.round(w*s);h=Math.round(h*s);
        const c=document.createElement('canvas');
        c.width=w;c.height=h;
        c.getContext('2d').drawImage(im,0,0,w,h);
        res(c.toDataURL('image/jpeg',0.86));
      };
      im.src=fr.result;
    };
    fr.readAsDataURL(file);
  });
}

/* ==========================================================
   Draw
   ========================================================== */
function draw(){
  ctx.save();
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle='#F6F3ED';ctx.fillRect(0,0,W,H);

  const v=view();
  ctx.save();
  ctx.translate(v.x,v.y);ctx.scale(v.z,v.z);

  for(const it of page().items) paint(it);

  if(sel){const it=page().items.find(i=>i.id===sel);if(it)handles(it);}
  if(ghost) paint(ghost,true);

  ctx.restore();
  ctx.restore();
}

function paint(it,isGhost){
  const col=it.done?'#3DD68C':(it.color||'#FF3B30');
  ctx.save();
  ctx.globalAlpha=isGhost?0.65:1;
  ctx.strokeStyle=col;ctx.fillStyle=col;
  ctx.lineCap='round';ctx.lineJoin='round';

  if(it.t==='img'){
    const im=imgCache[it.src]||getImg(it.src);
    if(im){ctx.drawImage(im,it.x,it.y,it.w,it.h);}
    else{ctx.fillStyle='#1F232A';ctx.fillRect(it.x,it.y,it.w,it.h);}
  }
  else if(it.t==='arrow'){
    drawArrow(ctx,it);
  }
  else if(it.t==='cone'){
    drawCone(ctx,it);
  }
  else if(it.t==='rect'){
    ctx.lineWidth=it.weight||3;
    if(it.dash)ctx.setLineDash([(it.weight||3)*3.2,(it.weight||3)*2.6]);
    ctx.strokeRect(it.x,it.y,it.w,it.h);
    ctx.setLineDash([]);
    if(it.grid)thirds(ctx,it);
  }
  else if(it.t==='pen'){
    ctx.lineWidth=it.weight||3;
    ctx.beginPath();
    smoothPath(ctx,it.pts);
    ctx.stroke();
  }
  else if(it.t==='text'){
    ctx.font=`600 ${it.size||16}px 'Space Grotesk', sans-serif`;
    ctx.textBaseline='top';
    ctx.fillText(it.txt||'',it.x,it.y);
  }
  ctx.restore();
}


/* Arrow styles: 0 = open chevron (marker style), 1 = solid head, 2 = line only */
function drawArrow(g,it){
  const w=it.weight||3;
  const dx=it.x2-it.x1, dy=it.y2-it.y1;
  const len=Math.hypot(dx,dy)||1;
  const a=Math.atan2(dy,dx);
  const st=it.style||0;
  const head=Math.min(Math.max(w*5.4,18),len*0.5);
  const sp=0.55;
  g.lineWidth=w;
  g.lineCap='round';g.lineJoin='round';

  if(st===2){
    g.beginPath();g.moveTo(it.x1,it.y1);g.lineTo(it.x2,it.y2);g.stroke();
    return;
  }
  if(st===1){
    const ux=dx/len,uy=dy/len;
    g.beginPath();g.moveTo(it.x1,it.y1);g.lineTo(it.x2-ux*head*0.8,it.y2-uy*head*0.8);g.stroke();
    g.beginPath();g.moveTo(it.x2,it.y2);
    g.lineTo(it.x2-head*Math.cos(a-0.42),it.y2-head*Math.sin(a-0.42));
    g.lineTo(it.x2-head*Math.cos(a+0.42),it.y2-head*Math.sin(a+0.42));
    g.closePath();g.fill();
    return;
  }
  // style 0 — full shaft to tip, two open barbs (matches hand-drawn reference)
  g.beginPath();g.moveTo(it.x1,it.y1);g.lineTo(it.x2,it.y2);g.stroke();
  g.beginPath();
  g.moveTo(it.x2-head*Math.cos(a-sp),it.y2-head*Math.sin(a-sp));
  g.lineTo(it.x2,it.y2);
  g.lineTo(it.x2-head*Math.cos(a+sp),it.y2-head*Math.sin(a+sp));
  g.stroke();
}

/* focal cone: full FOV angle in radians from focal length + sensor */
function coneFov(it){
  const half=(it.sensor==='ff')?18:11.75;   // half sensor width, mm
  return 2*Math.atan(half/(it.fmm||24));
}
function conePts(it){
  const dx=it.x2-it.x1,dy=it.y2-it.y1;
  const len=Math.hypot(dx,dy)||1;
  const a=Math.atan2(dy,dx);
  const w=len*Math.tan(coneFov(it)/2);
  const px=-Math.sin(a),py=Math.cos(a);
  return{
    apex:{x:it.x1,y:it.y1},
    e1:{x:it.x2+px*w,y:it.y2+py*w},
    e2:{x:it.x2-px*w,y:it.y2-py*w}
  };
}
function thirds(g,it){
  g.save();
  g.globalAlpha=.45;
  g.lineWidth=Math.max(1,(it.weight||3)*.4);
  g.setLineDash([]);
  g.beginPath();
  g.moveTo(it.x+it.w/3,it.y);g.lineTo(it.x+it.w/3,it.y+it.h);
  g.moveTo(it.x+it.w*2/3,it.y);g.lineTo(it.x+it.w*2/3,it.y+it.h);
  g.moveTo(it.x,it.y+it.h/3);g.lineTo(it.x+it.w,it.y+it.h/3);
  g.moveTo(it.x,it.y+it.h*2/3);g.lineTo(it.x+it.w,it.y+it.h*2/3);
  g.stroke();
  g.restore();
}
function hexA(hex,a){
  const n=parseInt(hex.slice(1),16);
  return 'rgba('+((n>>16)&255)+','+((n>>8)&255)+','+(n&255)+','+a+')';
}
function rr(g,x,y,w,h,r){
  g.beginPath();
  g.moveTo(x+r,y);
  g.arcTo(x+w,y,x+w,y+h,r);
  g.arcTo(x+w,y+h,x,y+h,r);
  g.arcTo(x,y+h,x,y,r);
  g.arcTo(x,y,x+w,y,r);
  g.closePath();
}
function drawCone(g,it){
  const col=it.done?'#3DD68C':(it.color||'#FF3B30');
  const{apex,e1,e2}=conePts(it);
  const w=it.weight||3;
  const fx=(e1.x+e2.x)/2,fy=(e1.y+e2.y)/2;
  g.save();
  g.lineCap='round';g.lineJoin='round';

  // light falls off from the camera: gradient fill
  const grad=g.createLinearGradient(apex.x,apex.y,fx,fy);
  grad.addColorStop(0,hexA(col,.20));
  grad.addColorStop(.55,hexA(col,.08));
  grad.addColorStop(1,hexA(col,.02));
  g.beginPath();
  g.moveTo(apex.x,apex.y);g.lineTo(e1.x,e1.y);g.lineTo(e2.x,e2.y);g.closePath();
  g.fillStyle=grad;g.fill();

  // side rays: solid
  g.strokeStyle=col;g.lineWidth=w;
  g.beginPath();
  g.moveTo(apex.x,apex.y);g.lineTo(e1.x,e1.y);
  g.moveTo(apex.x,apex.y);g.lineTo(e2.x,e2.y);
  g.stroke();

  // far plane: dashed, lighter — reads as "reach", not a wall
  g.beginPath();g.moveTo(e1.x,e1.y);g.lineTo(e2.x,e2.y);
  g.setLineDash([w*2.6,w*2.4]);
  g.lineWidth=Math.max(1.2,w*.7);g.globalAlpha=.7;
  g.stroke();
  g.setLineDash([]);g.globalAlpha=1;

  // FOV arc at the apex — the angle made visible
  const a=Math.atan2(it.y2-it.y1,it.x2-it.x1);
  const half=coneFov(it)/2;
  const len=Math.hypot(it.x2-it.x1,it.y2-it.y1)||1;
  const ar=Math.min(30,len*.28);
  g.beginPath();g.arc(apex.x,apex.y,ar,a-half,a+half);
  g.lineWidth=Math.max(1.1,w*.55);g.globalAlpha=.5;
  g.strokeStyle=col;g.stroke();
  g.globalAlpha=1;

  // camera body: white ring + colored core
  g.beginPath();g.arc(apex.x,apex.y,w*2.3,0,7);
  g.fillStyle='#FFFFFF';g.fill();
  g.lineWidth=w*.9;g.strokeStyle=col;g.stroke();
  g.beginPath();g.arc(apex.x,apex.y,w*1.05,0,7);
  g.fillStyle=col;g.fill();

  // focal label: floating pill on the axis
  const lx=(it.x1+it.x2)/2, ly=(it.y1+it.y2)/2;
  const lbl=(it.fmm||14)+'mm';
  g.font="700 13px 'Space Grotesk', sans-serif";
  g.textAlign='center';g.textBaseline='middle';
  const tw=g.measureText(lbl).width;
  const pw=tw+20,ph=25;
  g.shadowColor='rgba(30,24,17,.18)';g.shadowBlur=8;g.shadowOffsetY=2;
  rr(g,lx-pw/2,ly-ph/2,pw,ph,ph/2);
  g.fillStyle='rgba(255,255,255,.97)';g.fill();
  g.shadowColor='transparent';g.shadowBlur=0;g.shadowOffsetY=0;
  g.lineWidth=1.2;g.strokeStyle=hexA(col,.4);g.stroke();
  g.fillStyle=col;
  g.fillText(lbl,lx,ly+.5);
  g.restore();
}

function smoothPath(g,pts){
  if(pts.length<3){
    g.moveTo(pts[0].x,pts[0].y);
    for(let i=1;i<pts.length;i++)g.lineTo(pts[i].x,pts[i].y);
    return;
  }
  g.moveTo(pts[0].x,pts[0].y);
  for(let i=1;i<pts.length-1;i++){
    const mx=(pts[i].x+pts[i+1].x)/2, my=(pts[i].y+pts[i+1].y)/2;
    g.quadraticCurveTo(pts[i].x,pts[i].y,mx,my);
  }
  g.lineTo(pts[pts.length-1].x,pts[pts.length-1].y);
}

function bbox(it){
  if(it.t==='cone'){
    const{apex,e1,e2}=conePts(it);
    const xs=[apex.x,e1.x,e2.x],ys=[apex.y,e1.y,e2.y];
    return{x:Math.min(...xs),y:Math.min(...ys),
      w:Math.max(...xs)-Math.min(...xs),h:Math.max(...ys)-Math.min(...ys)};
  }
  if(it.t==='arrow')return{x:Math.min(it.x1,it.x2),y:Math.min(it.y1,it.y2),w:Math.abs(it.x2-it.x1),h:Math.abs(it.y2-it.y1)};
  if(it.t==='pen'){
    const xs=it.pts.map(p=>p.x),ys=it.pts.map(p=>p.y);
    return{x:Math.min(...xs),y:Math.min(...ys),w:Math.max(...xs)-Math.min(...xs),h:Math.max(...ys)-Math.min(...ys)};
  }
  if(it.t==='text'){
    ctx.save();ctx.font=`600 ${it.size||16}px 'Space Grotesk', sans-serif`;
    const w=ctx.measureText(it.txt||'').width;ctx.restore();
    return{x:it.x,y:it.y,w,h:(it.size||16)*1.25};
  }
  return{x:it.x,y:it.y,w:it.w,h:it.h};
}

function handles(it){
  const v=view(),z=v.z;
  const b=bbox(it);
  ctx.save();
  ctx.strokeStyle=it.lock?(shielded(it)?'#8B939F':'#7C879A'):'#5B9DFF';ctx.lineWidth=1.4/z;ctx.setLineDash([5/z,4/z]);
  ctx.strokeRect(b.x-4/z,b.y-4/z,b.w+8/z,b.h+8/z);
  ctx.setLineDash([]);
  if(it.lock){
    const bd=lockBadge(it), R=15/z;
    ctx.beginPath();ctx.arc(bd.x,bd.y,R,0,7);
    ctx.fillStyle='#FFFFFF';ctx.fill();
    ctx.strokeStyle='#8B939F';ctx.lineWidth=1.5/z;ctx.stroke();
    const s=9/z;
    ctx.strokeStyle='#6E655A';ctx.lineWidth=1.9/z;
    ctx.strokeRect(bd.x-s/2,bd.y-s*0.18,s,s*0.62);
    ctx.beginPath();ctx.arc(bd.x,bd.y-s*0.18,s*0.29,Math.PI,0);ctx.stroke();
    if(!shielded(it))paintDelBadge(it);
    ctx.restore();return;
  }

  const r=8/z;
  const pts=(it.t==='arrow'||it.t==='cone')
    ? [{x:it.x1,y:it.y1},{x:it.x2,y:it.y2}]
    : (it.t==='rect'||it.t==='img')
      ? [{x:it.x,y:it.y},{x:it.x+it.w,y:it.y},{x:it.x,y:it.y+it.h},{x:it.x+it.w,y:it.y+it.h}]
      : [];
  ctx.fillStyle='#fff';ctx.strokeStyle='#5B9DFF';ctx.lineWidth=1.6/z;
  for(const p of pts){ctx.beginPath();ctx.arc(p.x,p.y,r,0,7);ctx.fill();ctx.stroke();}

  // open padlock badge (tap to lock)
  const bd=lockBadge(it), BR=15/z;
  ctx.beginPath();ctx.arc(bd.x,bd.y,BR,0,7);
  ctx.fillStyle='#FFFFFF';ctx.fill();
  ctx.strokeStyle='#5B9DFF';ctx.lineWidth=1.5/z;ctx.stroke();
  const ls=9/z;
  ctx.strokeStyle='#6E655A';ctx.lineWidth=1.9/z;
  ctx.strokeRect(bd.x-ls/2,bd.y-ls*0.18,ls,ls*0.62);
  ctx.beginPath();ctx.arc(bd.x+ls*0.42,bd.y-ls*0.18,ls*0.29,Math.PI,0);ctx.stroke();
  paintDelBadge(it);

  // move grip above the shape
  const g=grip(it);
  ctx.beginPath();ctx.arc(g.x,g.y,11/z,0,7);
  ctx.fillStyle='#5B9DFF';ctx.fill();
  ctx.strokeStyle='#fff';ctx.lineWidth=2/z;
  ctx.beginPath();
  ctx.moveTo(g.x-4/z,g.y);ctx.lineTo(g.x+4/z,g.y);
  ctx.moveTo(g.x,g.y-4/z);ctx.lineTo(g.x,g.y+4/z);
  ctx.stroke();
  ctx.restore();
}
function lockBadge(it){const b=bbox(it),z=view().z;return{x:b.x+b.w+18/z,y:b.y-18/z};}
function delBadge(it){const b=lockBadge(it),z=view().z;return{x:b.x,y:b.y+34/z};}
function paintDelBadge(it){
  const z=view().z,d=delBadge(it),R=15/z;
  ctx.beginPath();ctx.arc(d.x,d.y,R,0,7);
  ctx.fillStyle='#FFFFFF';ctx.fill();
  ctx.strokeStyle='#FF3B30';ctx.lineWidth=1.5/z;ctx.stroke();
  const k=4.6/z;
  ctx.strokeStyle='#FF3B30';ctx.lineWidth=1.9/z;
  ctx.beginPath();
  ctx.moveTo(d.x-k,d.y-k);ctx.lineTo(d.x+k,d.y+k);
  ctx.moveTo(d.x+k,d.y-k);ctx.lineTo(d.x-k,d.y+k);
  ctx.stroke();
}
function grip(it){const b=bbox(it),z=view().z;return{x:b.x+b.w/2,y:b.y-28/z};}

/* ==========================================================
   Hit testing
   ========================================================== */
function distSeg(px,py,x1,y1,x2,y2){
  const dx=x2-x1,dy=y2-y1;const L=dx*dx+dy*dy;
  let t=L?((px-x1)*dx+(py-y1)*dy)/L:0;t=Math.max(0,Math.min(1,t));
  return Math.hypot(px-(x1+t*dx),py-(y1+t*dy));
}
function hit(it,p,tol){
  if(it.t==='cone'){
    const{apex,e1,e2}=conePts(it);
    const sign=(a,b,c)=>(p.x-c.x)*(b.y-c.y)-(b.x-c.x)*(p.y-c.y);
    const d1=sign(p,e1,apex),d2=sign(p,e2,e1),d3=sign(p,apex,e2);
    const neg=(d1<0)||(d2<0)||(d3<0), pos=(d1>0)||(d2>0)||(d3>0);
    if(!(neg&&pos))return true;
    const t=tol+(it.weight||3);
    return distSeg(p.x,p.y,apex.x,apex.y,e1.x,e1.y)<=t
        || distSeg(p.x,p.y,apex.x,apex.y,e2.x,e2.y)<=t
        || distSeg(p.x,p.y,e1.x,e1.y,e2.x,e2.y)<=t;
  }
  if(it.t==='arrow')return distSeg(p.x,p.y,it.x1,it.y1,it.x2,it.y2)<=tol+(it.weight||3);
  if(it.t==='pen'){
    for(let i=1;i<it.pts.length;i++)
      if(distSeg(p.x,p.y,it.pts[i-1].x,it.pts[i-1].y,it.pts[i].x,it.pts[i].y)<=tol+(it.weight||3))return true;
    return false;
  }
  if(it.t==='rect'){
    const t=tol+(it.weight||3);
    const inO=p.x>=it.x-t&&p.x<=it.x+it.w+t&&p.y>=it.y-t&&p.y<=it.y+it.h+t;
    const inI=p.x>=it.x+t&&p.x<=it.x+it.w-t&&p.y>=it.y+t&&p.y<=it.y+it.h-t;
    return inO&&!inI;
  }
  const b=bbox(it);
  return p.x>=b.x-tol&&p.x<=b.x+b.w+tol&&p.y>=b.y-tol&&p.y<=b.y+b.h+tol;
}
// Lock only shields images from erase/mark. Annotations remain targetable when locked.
const shielded=it=>it.lock&&it.t==='img';

function pick(p,tol,skipLocked){
  const its=page().items;
  for(let i=its.length-1;i>=0;i--){
    if(skipLocked&&shielded(its[i]))continue;
    if(hit(its[i],p,tol))return its[i];
  }
  return null;
}
function pickMark(p,tol){
  const its=page().items;
  for(let i=its.length-1;i>=0;i--){
    const it=its[i];
    if(shielded(it))continue;
    if(hit(it,p,tol))return it;
  }
  return null;
}

/* ==========================================================
   FX layer — pulses + confetti
   ========================================================== */
const fx=document.getElementById('fx');
const fctx=fx.getContext('2d');
let pulses=[],confetti=[],fxRun=false;

function fxResize(){fx.width=Math.round(W*DPR);fx.height=Math.round(H*DPR);}
function pulse(wx,wy,color){
  const p=toScreen(wx,wy);
  pulses.push({x:p.x,y:p.y,t:0,color});
  fxKick();
}
function boom(){
  const cols=['#FF3B30','#FFC24B','#3DD68C','#F5EFE7','#5B9DFF'];
  for(let i=0;i<90;i++){
    const a=Math.random()*Math.PI*2, sp=3+Math.random()*7.5;
    confetti.push({
      x:W/2,y:H*0.36,
      vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-3.2,
      rot:Math.random()*Math.PI,vr:(Math.random()-.5)*0.3,
      w:5+Math.random()*6,h:3+Math.random()*4,
      col:cols[i%cols.length],life:0
    });
  }
  fxKick();
}
function fxKick(){if(!fxRun){fxRun=true;requestAnimationFrame(fxTick);}}
function fxTick(){
  fctx.setTransform(DPR,0,0,DPR,0,0);
  fctx.clearRect(0,0,W,H);
  pulses=pulses.filter(p=>p.t<1);
  for(const p of pulses){
    p.t+=0.055;
    fctx.beginPath();
    fctx.arc(p.x,p.y,8+p.t*36,0,7);
    fctx.strokeStyle=p.color;
    fctx.globalAlpha=(1-p.t)*0.85;
    fctx.lineWidth=3*(1-p.t)+0.5;
    fctx.stroke();
  }
  fctx.globalAlpha=1;
  confetti=confetti.filter(c=>c.life<160&&c.y<H+30);
  for(const c of confetti){
    c.life++;c.x+=c.vx;c.y+=c.vy;c.vy+=0.16;c.vx*=0.99;c.rot+=c.vr;
    fctx.save();
    fctx.translate(c.x,c.y);fctx.rotate(c.rot);
    fctx.globalAlpha=c.life>120?(160-c.life)/40:1;
    fctx.fillStyle=c.col;
    fctx.fillRect(-c.w/2,-c.h/2,c.w,c.h);
    fctx.restore();
  }
  fctx.globalAlpha=1;
  if(pulses.length||confetti.length)requestAnimationFrame(fxTick);
  else{fxRun=false;fctx.clearRect(0,0,W,H);}
}

/* ==========================================================
   Shot progress
   ========================================================== */
const celebrated=new Set();
function pageShots(pg){
  const sh=pg.items.filter(i=>i.t==='rect'||i.t==='arrow'||i.t==='cone');
  return{t:sh.length,d:sh.filter(i=>i.done).length};
}
function syncProgress(){
  const{t,d}=pageShots(page());
  const pill=document.getElementById('progPill');
  pill.classList.toggle('on',t>0);
  pill.classList.toggle('full',t>0&&d===t);
  document.getElementById('progFill').style.width=t?Math.round(d/t*100)+'%':'0';
  document.getElementById('progTxt').textContent=d+'/'+t;
  const id=page().id;
  if(t>0&&d===t){
    if(!celebrated.has(id)&&mode==='board'){celebrated.add(id);boom();toast('All shots captured on this page');}
  }else celebrated.delete(id);
}

/* ==========================================================
   Pointer handling
   ========================================================== */
let ghost=null;
let act=null;
let dtT=0;
let itemTap={id:null,t:0};

/* snap a vector to horizontal/vertical when within 8 degrees */
function hvSnap(ax,ay,px,py){
  const dx=px-ax, dy=py-ay;
  const T=Math.tan(8*Math.PI/180);
  if(Math.abs(dy)<=Math.abs(dx)*T)return{x:px,y:ay};
  if(Math.abs(dx)<=Math.abs(dy)*T)return{x:ax,y:py};
  return null;
}
const ptrs=new Map();
let pinch=null;

cv.addEventListener('pointerdown',e=>{
  cv.setPointerCapture(e.pointerId);
  ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(ptrs.size===2){startPinch();act=null;ghost=null;draw();return;}
  if(ptrs.size>2)return;

  const r=cv.getBoundingClientRect();
  const sp={x:e.clientX-r.left,y:e.clientY-r.top};
  const p=toWorld(sp.x,sp.y);
  const tol=18/view().z;

  // lock/unlock badge on the selected item — always checked first
  if(sel){
    const si=page().items.find(i=>i.id===sel);
    if(si){
      const dd=delBadge(si);
      if(!(si.t==='img'&&si.lock)&&Math.hypot(p.x-dd.x,p.y-dd.y)<=19/view().z){
        const bb=bbox(si);
        pulse(bb.x+bb.w/2,bb.y+bb.h/2,'#FF3B30');
        page().items=page().items.filter(i=>i.id!==sel);
        sel=null;save();showOpts();draw();renderThumbs();syncEmpty();
        return;
      }
      const bd=lockBadge(si);
      if(Math.hypot(p.x-bd.x,p.y-bd.y)<=19/view().z){
        si.lock=!si.lock;
        toast(si.lock?'Locked':'Unlocked');
        save();showOpts();draw();return;
      }
    }
  }

  if(tool==='pan'){act={k:'pan',sx:e.clientX,sy:e.clientY,vx:view().x,vy:view().y};return;}

  if(tool==='select'){
    if(sel){
      const it=page().items.find(i=>i.id===sel);
      if(it&&!it.lock){
        const g=grip(it);
        if(Math.hypot(p.x-g.x,p.y-g.y)<=17/view().z){
          act={k:'move',it,p};return;
        }
        const h=grabHandle(it,p);
        if(h){act={k:'resize',it,h,p,o:JSON.parse(JSON.stringify(it))};return;}
      }
    }
    const it=pick(p,tol,true)||pick(p,tol);
    if(!it){
      const now=Date.now();
      if(now-dtT<320){fitPage();toast('Fit to page');dtT=0;}
      else dtT=now;
    }
    if(it&&it.t!=='img'){
      const nowT=Date.now();
      if(itemTap.id===it.id&&nowT-itemTap.t<340){
        itemTap={id:null,t:0};
        it.done=!it.done;
        const bb=bbox(it);
        pulse(bb.x+bb.w/2,bb.y+bb.h/2,it.done?'#3DD68C':'#A89E92');
        sel=it.id;act=null;
        save();showOpts();draw();renderThumbs();
        return;
      }
      itemTap={id:it.id,t:nowT};
    }
    sel=it?it.id:null;
    if(it&&!it.lock)act={k:'move',it,p};
    else act=null;
    showOpts();draw();return;
  }

  if(tool==='arrow'||tool==='rect'||tool==='cone'){
    // if a shape is already selected, let its handles/grip win
    if(sel){
      const it=page().items.find(i=>i.id===sel);
      if(it&&!it.lock){
        const g=grip(it);
        if(Math.hypot(p.x-g.x,p.y-g.y)<=16/view().z){act={k:'move',it,p};return;}
        const hh=grabHandle(it,p);
        if(hh){act={k:'resize',it,h:hh,p,o:JSON.parse(JSON.stringify(it))};return;}
      }
    }
    // tapping an existing unlocked shape picks it up rather than drawing a new one
    const existing=pick(p,16/view().z,true);
    if(existing&&existing.t!=='img'){
      const nowT=Date.now();
      if(itemTap.id===existing.id&&nowT-itemTap.t<340){
        itemTap={id:null,t:0};
        existing.done=!existing.done;
        const bb=bbox(existing);
        pulse(bb.x+bb.w/2,bb.y+bb.h/2,existing.done?'#3DD68C':'#A89E92');
        sel=existing.id;act=null;
        save();showOpts();draw();renderThumbs();
        return;
      }
      itemTap={id:existing.id,t:nowT};
      sel=existing.id;
      if(!existing.lock)act={k:'move',it:existing,p};
      showOpts();draw();return;
    }
  }
  if(tool==='arrow'){sel=null;ghost={t:'arrow',x1:p.x,y1:p.y,x2:p.x,y2:p.y,weight:opt.weight,style:opt.style,color:'#FF3B30'};act={k:'arrow'};return;}
  if(tool==='cone'){sel=null;ghost={t:'cone',x1:p.x,y1:p.y,x2:p.x,y2:p.y,fmm:opt.fmm,sensor:opt.sensor,weight:opt.weight,color:'#FF3B30'};act={k:'cone'};return;}
  if(tool==='rect'){sel=null;ghost={t:'rect',x:p.x,y:p.y,w:0,h:0,dash:opt.dash,grid:opt.grid,weight:opt.weight,color:'#FF3B30'};act={k:'rect',ox:p.x,oy:p.y};return;}
  if(tool==='pen'){ghost={t:'pen',pts:[p],weight:opt.weight,color:'#FF3B30'};act={k:'pen'};return;}
  if(tool==='erase'){sel=null;act={k:'erase'};doErase(p,tol);showOpts();return;}
  if(tool==='mark'){sel=null;act={k:'mark',seen:new Set()};doMark(p,tol,act.seen);showOpts();return;}
  if(tool==='text'){
    const t=prompt('Text');
    if(t&&t.trim()){page().items.push({id:uid(),t:'text',txt:t.trim(),x:p.x,y:p.y,size:opt.size,color:'#FF3B30'});save();draw();renderThumbs();syncEmpty();}
    return;
  }
});

cv.addEventListener('pointermove',e=>{
  if(ptrs.has(e.pointerId))ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(ptrs.size>=2&&pinch){doPinch();return;}
  if(!act)return;

  const r=cv.getBoundingClientRect();
  const p=toWorld(e.clientX-r.left,e.clientY-r.top);
  const tol=12/view().z;

  switch(act.k){
    case 'pan':{
      const v=view();
      v.x=act.vx+(e.clientX-act.sx);
      v.y=act.vy+(e.clientY-act.sy);
      break;
    }
    case 'arrow':{
      const sn=hvSnap(ghost.x1,ghost.y1,p.x,p.y);
      ghost.x2=sn?sn.x:p.x; ghost.y2=sn?sn.y:p.y;
      break;
    }
    case 'cone':{
      const sn=hvSnap(ghost.x1,ghost.y1,p.x,p.y);
      ghost.x2=sn?sn.x:p.x; ghost.y2=sn?sn.y:p.y;
      break;
    }
    case 'rect':{
      let w=p.x-act.ox,h=p.y-act.oy;
      let R=ratioOf(opt.ratio);
      if(R){
        // orientation snap: drag mostly vertical -> portrait, mostly horizontal -> landscape
        const portrait=Math.abs(h)>Math.abs(w);
        if(portrait&&R<1)R=1/R;
        if(!portrait&&R>1)R=1/R;
        ghost.ratioUsed=portrait?'portrait':'landscape';
        const m=Math.max(Math.abs(w),Math.abs(h)/R);
        w=Math.sign(w||1)*m; h=Math.sign(h||1)*m*R;
      }
      ghost.x=w<0?act.ox+w:act.ox;
      ghost.y=h<0?act.oy+h:act.oy;
      ghost.w=Math.abs(w);ghost.h=Math.abs(h);
      break;
    }
    case 'pen':{
      const last=ghost.pts[ghost.pts.length-1];
      if(Math.hypot(p.x-last.x,p.y-last.y)>1.4/view().z)ghost.pts.push(p);
      break;
    }
    case 'move':{
      const dx=p.x-act.p.x,dy=p.y-act.p.y;
      moveItem(act.it,dx,dy);
      act.p=p;
      break;
    }
    case 'resize': doResize(act,p);break;
    case 'erase': doErase(p,tol);break;
    case 'mark': doMark(p,tol,act.seen);break;
  }
  draw();
});

function endPtr(e){
  ptrs.delete(e.pointerId);
  if(ptrs.size<2)pinch=null;
  if(!act)return;
  if(act.k==='arrow'||act.k==='cone'){
    if(Math.hypot(ghost.x2-ghost.x1,ghost.y2-ghost.y1)>9/view().z){
      const a={id:uid(),...ghost};page().items.push(a);sel=a.id;save();showOpts();
    }
  }
  if(act.k==='rect'){
    if(ghost.w>9/view().z&&ghost.h>9/view().z){
      const r={id:uid(),...ghost};
      if(opt.ratio!=='free')r.lockR=ghost.h/ghost.w;
      page().items.push(r);sel=r.id;save();showOpts();
    }
  }
  if(act.k==='pen'){
    if(ghost.pts.length>1){page().items.push({id:uid(),...ghost});save();}
  }
  if(act.k==='move'||act.k==='resize'||act.k==='erase'||act.k==='mark')save();
  if(act.k==='pan'){noHist=true;save();noHist=false;}
  ghost=null;act=null;
  draw();renderThumbs();syncEmpty();
}
cv.addEventListener('pointerup',endPtr);
cv.addEventListener('pointercancel',endPtr);
cv.addEventListener('pointerleave',e=>{if(act&&act.k!=='pan')endPtr(e);});

function moveItem(it,dx,dy){
  if(it.t==='arrow'||it.t==='cone'){it.x1+=dx;it.y1+=dy;it.x2+=dx;it.y2+=dy;}
  else if(it.t==='pen'){it.pts.forEach(p=>{p.x+=dx;p.y+=dy;});}
  else{it.x+=dx;it.y+=dy;}
}

function grabHandle(it,p){
  const t=20/view().z;
  if(it.t==='arrow'||it.t==='cone'){
    if(Math.hypot(p.x-it.x1,p.y-it.y1)<t)return'a';
    if(Math.hypot(p.x-it.x2,p.y-it.y2)<t)return'b';
    return null;
  }
  if(it.t==='rect'||it.t==='img'){
    const c=[['tl',it.x,it.y],['tr',it.x+it.w,it.y],['bl',it.x,it.y+it.h],['br',it.x+it.w,it.y+it.h]];
    for(const[k,x,y]of c) if(Math.hypot(p.x-x,p.y-y)<t)return k;
  }
  return null;
}

function doResize(a,p){
  const it=a.it,o=a.o;
  if(it.t==='arrow'||it.t==='cone'){
    if(a.h==='a'){
      const sn=hvSnap(it.x2,it.y2,p.x,p.y);
      it.x1=sn?sn.x:p.x; it.y1=sn?sn.y:p.y;
    }else{
      const sn=hvSnap(it.x1,it.y1,p.x,p.y);
      it.x2=sn?sn.x:p.x; it.y2=sn?sn.y:p.y;
    }
    return;
  }
  const lock = it.t==='rect' ? (it.lockR||null) : (o.h/o.w);
  let ax,ay;
  if(a.h==='br'){ax=o.x;ay=o.y;}
  else if(a.h==='bl'){ax=o.x+o.w;ay=o.y;}
  else if(a.h==='tr'){ax=o.x;ay=o.y+o.h;}
  else{ax=o.x+o.w;ay=o.y+o.h;}
  let w=p.x-ax,h=p.y-ay;
  if(lock){
    const m=Math.max(Math.abs(w),Math.abs(h)/lock);
    w=Math.sign(w||1)*m;h=Math.sign(h||1)*m*lock;
  }
  it.x=w<0?ax+w:ax; it.y=h<0?ay+h:ay;
  it.w=Math.max(Math.abs(w),6); it.h=Math.max(Math.abs(h),6);
}

function doErase(p,tol){
  const it=pick(p,tol,true);
  if(it){
    const b=bbox(it);
    pulse(b.x+b.w/2,b.y+b.h/2,'#FF3B30');
    page().items=page().items.filter(i=>i.id!==it.id);
    if(sel===it.id){sel=null;showOpts();}
  }
}
function doMark(p,tol,seen){
  const it=pickMark(p,tol);
  if(it&&!seen.has(it.id)){
    seen.add(it.id);it.done=!it.done;
    const b=bbox(it);
    pulse(b.x+b.w/2,b.y+b.h/2,it.done?'#3DD68C':'#A89E92');
  }
}

/* Pinch zoom */
function startPinch(){
  const[a,b]=[...ptrs.values()];
  const r=cv.getBoundingClientRect();
  pinch={d:Math.hypot(a.x-b.x,a.y-b.y),z:view().z,
    cx:(a.x+b.x)/2-r.left,cy:(a.y+b.y)/2-r.top,
    vx:view().x,vy:view().y};
}
function doPinch(){
  const[a,b]=[...ptrs.values()];
  const r=cv.getBoundingClientRect();
  const d=Math.hypot(a.x-b.x,a.y-b.y);
  const mx=(a.x+b.x)/2-r.left, my=(a.y+b.y)/2-r.top;
  if(!pinch.d)return;
  const nz=Math.max(0.15,Math.min(7,pinch.z*(d/pinch.d)));
  const v=view();
  const k=nz/pinch.z;
  v.z=nz;
  // zoom about original midpoint, then translate by midpoint drift = two-finger pan
  v.x=pinch.cx-(pinch.cx-pinch.vx)*k + (mx-pinch.cx);
  v.y=pinch.cy-(pinch.cy-pinch.vy)*k + (my-pinch.cy);
  draw();
}

cv.addEventListener('wheel',e=>{
  e.preventDefault();
  const r=cv.getBoundingClientRect();
  const mx=e.clientX-r.left,my=e.clientY-r.top;
  const v=view();
  const k=Math.exp(-e.deltaY*0.0016);
  const nz=Math.max(0.15,Math.min(7,v.z*k));
  const rk=nz/v.z;
  v.x=mx-(mx-v.x)*rk;v.y=my-(my-v.y)*rk;v.z=nz;
  draw();
},{passive:false});

/* ==========================================================
   Tools + options bar
   ========================================================== */
const ratioOf=r=>r==='3:2'?2/3:r==='16:9'?9/16:r==='4:5'?5/4:r==='7:5'?5/7:r==='1:1'?1:null;

document.querySelectorAll('.tool[data-tool]').forEach(b=>{
  b.onclick=()=>{
    const t=b.dataset.tool;
    if(tool===t){
      // second tap on the active tool cycles its main setting
      if(t==='rect'){
        opt.ratio=RATIOS[(RATIOS.indexOf(opt.ratio)+1)%RATIOS.length];
        toast('Ratio '+opt.ratio);
      }
      else if(t==='arrow'){
        opt.style=(opt.style+1)%STYLES.length;
        toast(STYLES[opt.style]);
      }
      else if(t==='cone'){
        const FL=focalList(opt.sensor);
        opt.fmm=FL[(FL.indexOf(opt.fmm)+1+FL.length)%FL.length];
        toast(opt.fmm+'mm');
      }
      else if(t==='pen'){
        const ws=[2,3,5,8];opt.weight=ws[(ws.indexOf(opt.weight)+1)%ws.length];
        toast('Weight '+opt.weight);
      }
      badges();showOpts();return;
    }
    tool=t;
    document.querySelectorAll('.tool[data-tool]').forEach(x=>x.classList.toggle('on',x===b));
    if(tool!=='select'){sel=null;}
    badges();showOpts();draw();
  };
});

/* small label under the rect/arrow icons showing current setting */
function badges(){
  const r=document.querySelector('.tool[data-tool="rect"]');
  const a=document.querySelector('.tool[data-tool="arrow"]');
  r.dataset.badge = opt.ratio==='free' ? 'FR' : opt.ratio.replace(':','');
  a.dataset.badge = ['CHV','SLD','LIN'][opt.style];
  const cn=document.querySelector('.tool[data-tool="cone"]');
  if(cn)cn.dataset.badge=opt.fmm+'';
}


/* Which named ratio does this rect currently match (either orientation)? */
function ratioTag(it){
  if(!it.w||!it.h)return 'free';
  const r=it.h/it.w;
  for(const name of RATIOS){
    const R=ratioOf(name);
    if(!R)continue;
    if(Math.abs(r-R)<0.02||Math.abs(r-1/R)<0.02)return name;
  }
  return 'free';
}

/* Re-shape a rect to a named ratio, keeping centre, area and orientation */
function applyRatio(it,name){
  const R=ratioOf(name);
  const cx=it.x+it.w/2, cy=it.y+it.h/2;
  if(!R){it.lockR=null;showOpts();draw();return;}
  const portrait=it.h>=it.w;
  const target=portrait ? Math.max(R,1/R) : Math.min(R,1/R);
  const area=Math.max(it.w*it.h,400);
  const nw=Math.sqrt(area/target), nh=nw*target;
  it.w=nw; it.h=nh;
  it.x=cx-nw/2; it.y=cy-nh/2;
  it.lockR=target;
}

      if(d.cf){opt.fmm=+d.cf;}

      if(selIt&&d.scf){selIt.fmm=+d.scf;save();renderThumbs();}
      if(selIt&&d.scs){selIt.sensor=d.scs;selIt.fmm=snapFocal(selIt.fmm||14,d.scs);save();renderThumbs();}
      if(selIt&&d.sr){applyRatio(selIt,d.sr);save();renderThumbs();}
      if(selIt&&d.sd!==undefined&&d.sd!==''){selIt.dash=d.sd==='1';save();renderThumbs();}
      if(selIt&&d.ss!==undefined&&d.ss!==''){selIt.style=+d.ss;save();renderThumbs();}
      if(selIt&&d.sw){selIt.weight=+d.sw;save();renderThumbs();}
      if(d.a&&selIt){
        const its=page().items;
        if(d.a==='lock'){selIt.lock=!selIt.lock;}
        if(d.a==='del'){page().items=its.filter(i=>i.id!==sel);sel=null;}
        if(d.a==='done'){
          selIt.done=!selIt.done;
          const bb=bbox(selIt);
          pulse(bb.x+bb.w/2,bb.y+bb.h/2,selIt.done?'#3DD68C':'#A89E92');
        }
        if(d.a==='front'){page().items=its.filter(i=>i.id!==sel).concat(selIt);}
        if(d.a==='flip'){
          const cx=selIt.x+selIt.w/2, cy=selIt.y+selIt.h/2;
          const nw=selIt.h, nh=selIt.w;
          selIt.x=cx-nw/2; selIt.y=cy-nh/2; selIt.w=nw; selIt.h=nh;

          moveItem(c,18,18);page().items.push(c);sel=c.id;
        }

document.getElementById('btnFit').onclick=fitPage;
function fitPage(){
  const its=page().items;
  const v=view();
  if(!its.length){v.x=0;v.y=0;v.z=1;draw();return;}
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  for(const it of its){const b=bbox(it);x0=Math.min(x0,b.x);y0=Math.min(y0,b.y);x1=Math.max(x1,b.x+b.w);y1=Math.max(y1,b.y+b.h);}
  const pad=40;
  const z=Math.max(0.15,Math.min(4,Math.min((W-pad*2)/Math.max(x1-x0,1),(H-pad*2)/Math.max(y1-y0,1))));
  v.z=z;
  v.x=W/2-((x0+x1)/2)*z;
  v.y=H/2-((y0+y1)/2)*z;
  draw();noHist=true;save();noHist=false;
}

    n.textContent=pg.name?String(i+1).padStart(2,'0')+' · '+pg.name:String(i+1).padStart(2,'0');
    d.appendChild(n);
    const ps=pageShots(pg);
    if(ps.t>0){
      const bar=document.createElement('div');bar.className='thumbbar';
      const fill=document.createElement('i');fill.style.width=Math.round(ps.d/ps.t*100)+'%';
      bar.appendChild(fill);d.appendChild(bar);
    }
    if(i===pageIdx){
      const ed=document.createElement('button');ed.className='thumbe';ed.textContent='✎';
      ed.onclick=ev=>{
        ev.stopPropagation();
        const nm=prompt('Page name',pg.name||'');
        if(nm===null)return;
        pg.name=nm.trim()||undefined;
        noHist=true;save();noHist=false;renderThumbs();
      };
      d.appendChild(ed);
    }
    if(proj().pages.length>1){
      const x=document.createElement('button');x.className='thumbx';x.textContent='✕';
      x.onclick=ev=>{
        ev.stopPropagation();
        if(!confirm('Delete page '+(i+1)+'?'))return;
        proj().pages.splice(i,1);
        if(pageIdx>=proj().pages.length)pageIdx=proj().pages.length-1;
        sel=null;noHist=true;save();noHist=false;histInit();renderThumbs();draw();syncEmpty();showOpts();
      };
      d.appendChild(x);
    }
    d.onclick=()=>{pageIdx=i;sel=null;histInit();renderThumbs();draw();syncEmpty();showOpts();};
    d.ondragstart=e=>{e.dataTransfer.setData('text/plain',i);d.classList.add('drag');};
    d.ondragend=()=>d.classList.remove('drag');
    d.ondragover=e=>e.preventDefault();
    d.ondrop=e=>{
      e.preventDefault();
      const from=+e.dataTransfer.getData('text/plain');
      if(from===i)return;
      const P=proj().pages;
      const cur=P[pageIdx];
      const[m]=P.splice(from,1);
      P.splice(i,0,m);
      pageIdx=P.indexOf(cur);
      save();renderThumbs();
    };
    // touch reorder: long-press then drag
    let lp=null,dragging=false;
    d.addEventListener('touchstart',e=>{
      lp=setTimeout(()=>{dragging=true;d.classList.add('drag');},420);
    },{passive:true});
    d.addEventListener('touchmove',e=>{
      if(!dragging){clearTimeout(lp);return;}
      e.preventDefault();
      const t=e.touches[0];
      const over=document.elementFromPoint(t.clientX,t.clientY);
      const tt=over&&over.closest('.thumb');
      if(tt&&+tt.dataset.i!==i){
        const j=+tt.dataset.i;
        const P=proj().pages;const cur=P[pageIdx];
        const[m]=P.splice(i,1);P.splice(j,0,m);
        pageIdx=P.indexOf(cur);
        save();renderThumbs();
        dragging=false;
      }
    },{passive:false});
    d.addEventListener('touchend',()=>{clearTimeout(lp);dragging=false;d.classList.remove('drag');},{passive:true});
    L.appendChild(d);
  });
  if(typeof syncProgress==='function')syncProgress();
  if(typeof renderRefs==='function')renderRefs();
}

function thumbPaint(c,pg){
  const g=c.getContext('2d');
  g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);
  if(!pg.items.length)return;
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  for(const it of pg.items){const b=bbox(it);x0=Math.min(x0,b.x);y0=Math.min(y0,b.y);x1=Math.max(x1,b.x+b.w);y1=Math.max(y1,b.y+b.h);}
  const z=Math.min(c.width/Math.max(x1-x0,1),c.height/Math.max(y1-y0,1))*0.9;
  g.save();
  g.translate(c.width/2,c.height/2);g.scale(z,z);g.translate(-(x0+x1)/2,-(y0+y1)/2);
  const oc=ctx.canvas,octx=ctx;
  paintInto(g,pg.items);
  g.restore();
}

function paintInto(g,items){
  const old=ctx.__g;
  for(const it of items){
    const col=it.done?'#3DD68C':(it.color||'#FF3B30');
    g.save();g.strokeStyle=col;g.fillStyle=col;g.lineCap='round';g.lineJoin='round';
    if(it.t==='img'){const im=imgCache[it.src];if(im)g.drawImage(im,it.x,it.y,it.w,it.h);else{g.fillStyle='#E5E7EA';g.fillRect(it.x,it.y,it.w,it.h);}}
    else if(it.t==='arrow'){drawArrow(g,it);}
    else if(it.t==='cone'){drawCone(g,it);}
    else if(it.t==='rect'){
      g.lineWidth=it.weight||3;
      if(it.dash)g.setLineDash([(it.weight||3)*3.2,(it.weight||3)*2.6]);
      g.strokeRect(it.x,it.y,it.w,it.h);g.setLineDash([]);
      if(it.grid)thirds(g,it);
    }
    else if(it.t==='pen'){
      g.lineWidth=it.weight||3;g.beginPath();
      smoothPath(g,it.pts);g.stroke();
    }
    else if(it.t==='text'){
      g.font=`600 ${it.size||16}px 'Space Grotesk', sans-serif`;g.textBaseline='top';
      g.fillText(it.txt||'',it.x,it.y);
    }
    g.restore();
  }
}

function renderPage(pg,maxW){
  const c=document.createElement('canvas');
  if(!pg.items.length){c.width=1200;c.height=850;const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);return c;}
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  for(const it of pg.items){const b=bbox(it);x0=Math.min(x0,b.x);y0=Math.min(y0,b.y);x1=Math.max(x1,b.x+b.w);y1=Math.max(y1,b.y+b.h);}
  const pad=44;
  const w=(x1-x0)+pad*2,h=(y1-y0)+pad*2;
  const s=Math.min(maxW/w,2.4);
  c.width=Math.round(w*s);c.height=Math.round(h*s);
  const g=c.getContext('2d');
  g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);
  g.save();g.scale(s,s);g.translate(-x0+pad,-y0+pad);
  paintInto(g,pg.items);
  g.restore();
  return c;
}

function liquify(el){
  if(!el||el._liq)return;
  const d=document.createElement('div');d.className='liq';
  el.prepend(d);el._liq=d;
}
function liqMove(el,btn,animate){
  if(!el||!el._liq||!btn)return;
  const liq=el._liq;
  const cr=el.getBoundingClientRect(),br=btn.getBoundingClientRect();
  const nl=br.left-cr.left, nw=br.width;
  if(animate===false||!liq._set){
    liq.style.transition='none';
    liq.style.left=nl+'px';liq.style.width=nw+'px';
    liq._set=1;void liq.offsetWidth;liq.style.transition='';
    return;
  }
  const ol=parseFloat(liq.style.left)||0, ow=parseFloat(liq.style.width)||0;
  const L=Math.min(ol,nl), R=Math.max(ol+ow,nl+nw);
  liq.style.left=L+'px';liq.style.width=(R-L)+'px';       // stretch across both
  clearTimeout(liq._t);
  liq._t=setTimeout(()=>{liq.style.left=nl+'px';liq.style.width=nw+'px';},150); // settle
}

/* ---------- Links (videos, posts, references) ---------- */
function ytId(u){
  const m=u.match(/(?:youtu\.be\/|v=|shorts\/|embed\/|live\/)([\w-]{11})/);
  return m?m[1]:null;
}
function platformOf(u){
  try{
    const h=new URL(u).hostname.replace('www.','');
    if(h.includes('youtu'))return'YouTube';
    if(h.includes('instagram'))return'Instagram';
    if(h.includes('tiktok'))return'TikTok';
    if(h.includes('vimeo'))return'Vimeo';
    if(h.includes('pinterest')||h.includes('pin.it'))return'Pinterest';
    return h;
  }catch(e){return'Link';}
}
function hostOf(u){try{return new URL(u).hostname.replace('www.','');}catch(e){return u;}}

function addLinkFlow(){
  let u=prompt('Paste the link (YouTube, Instagram, TikTok…)');
  if(!u||!u.trim())return;
  u=u.trim();
  if(!/^https?:\/\//i.test(u))u='https://'+u;
  try{new URL(u);}catch(e){toast('That does not look like a link');return;}
  const yid=ytId(u);
  const entry={
    id:uid(),url:u,
    platform:platformOf(u),
    title:hostOf(u),
    thumb:yid?('https://i.ytimg.com/vi/'+yid+'/hqdefault.jpg'):null,
    fetched:false
  };
  proj().links.unshift(entry);
  noHist=true;save();noHist=false;
  renderLinks();
  fetchLinkMeta(entry);
}

async function fetchLinkMeta(entry){
  try{
    const r=await fetch('https://noembed.com/embed?url='+encodeURIComponent(entry.url));
    const j=await r.json();
    let changed=false;
    if(j&&j.title){entry.title=j.title;changed=true;}
    if(j&&j.thumbnail_url&&!entry.thumb){entry.thumb=j.thumbnail_url;changed=true;}
    entry.fetched=true;
    if(changed){
      noHist=true;save();noHist=false;
      if(mode==='inspo'&&iview==='links')renderLinks();
    }
  }catch(e){
    entry.fetched=true;
    // offline or blocked — card keeps the domain as its title; user can rename
  }
}

const PLAT_ICON={YouTube:'▶',Instagram:'◎',TikTok:'♪',Vimeo:'▶',Pinterest:'◈'};

function renderLinks(){
  const g=document.getElementById('linkGrid');
  const L=proj().links;
  g.innerHTML='';
  document.getElementById('inspoCount').textContent=L.length+' link'+(L.length===1?'':'s');
  const effL=Math.max(1,Math.min(colPref.links,Math.max(1,L.length)));
  g.style.gridTemplateColumns='repeat('+effL+',1fr)';
  if(!L.length){
    g.innerHTML='<div class="emptyt" style="grid-column:1/-1;padding:40px 0;text-align:center">No links yet.<br>Save YouTube videos, reels, posts — anything worth stealing from.</div>';
    return;
  }
  L.forEach((lk,i)=>{
    const c=document.createElement('button');
    c.className='linkcard';
    c.style.animationDelay=Math.min(i*30,240)+'ms';

    const th=document.createElement('div');th.className='lthumb';
    if(lk.thumb){
      const im=document.createElement('img');im.src=lk.thumb;im.loading='lazy';
      im.onerror=()=>{im.remove();th.insertAdjacentHTML('beforeend','<span class="lfallback">'+(PLAT_ICON[lk.platform]||'⌁')+'</span>');};
      th.appendChild(im);
    }else{
      th.innerHTML='<span class="lfallback">'+(PLAT_ICON[lk.platform]||'⌁')+'</span>';
    }
    const pb=document.createElement('span');pb.className='lplat';pb.textContent=lk.platform;
    th.appendChild(pb);
    c.appendChild(th);

    const meta=document.createElement('div');meta.className='lmeta';
    meta.innerHTML='<div class="ltitle">'+esc(lk.title||'Untitled')+'</div><div class="lurl">'+esc(hostOf(lk.url))+'</div>';
    c.appendChild(meta);

    const ed=document.createElement('span');ed.className='le';ed.textContent='✎';
    ed.onclick=ev=>{
      ev.stopPropagation();
      const t=prompt('Title',lk.title||'');
      if(t===null)return;
      lk.title=t.trim()||hostOf(lk.url);
      noHist=true;save();noHist=false;renderLinks();
    };
    c.appendChild(ed);

    const x=document.createElement('span');x.className='lx';x.textContent='✕';
    x.onclick=ev=>{
      ev.stopPropagation();
      if(!confirm('Remove this link?'))return;
      proj().links=proj().links.filter(y=>y.id!==lk.id);
      noHist=true;save();noHist=false;renderLinks();
    };
    c.appendChild(x);

    c.onclick=()=>window.open(lk.url,'_blank');
    g.appendChild(c);
  });
}

/* ---------- Lightbox with slide animation ---------- */
const lb=document.getElementById('lightbox');
const track=document.getElementById('lbTrack');
const slides=[document.getElementById('lbA'),document.getElementById('lbB'),document.getElementById('lbC')];

function fillSlides(){
  const n=lbList.length;
  if(!n)return;
  const Wl=lb.clientWidth||window.innerWidth;
  const at=k=>lbList[((lbIdx+k)%n+n)%n];
  slides[0].src=n>1?at(-1).src:'';
  slides[1].src=at(0).src;
  slides[2].src=n>1?at(1).src:'';
  track.classList.remove('anim');
  track.style.transform='translateX('+(-Wl)+'px)';
  document.getElementById('lbPos').textContent=(lbIdx+1)+' / '+n;
  syncLbRoom();
}
function syncLbRoom(){
  const it=lbList[lbIdx];
  document.getElementById('lbRoom').textContent=it&&it.room?it.room:'Tag space';
}
function openLb(list,i){
  lbList=list.slice();lbIdx=i;
  lb.classList.add('on');
  fillSlides();
}
function stepLb(d){
  const n=lbList.length;
  if(n<2){if(!n)lb.classList.remove('on');return;}
  track.classList.add('anim');
  track.style.transform='translateX('+(-lb.clientWidth-d*lb.clientWidth)+'px)';
  const done=()=>{
    track.removeEventListener('transitionend',done);
    lbIdx=((lbIdx+d)%n+n)%n;
    fillSlides();
  };
  track.addEventListener('transitionend',done);
  setTimeout(()=>{if(track.classList.contains('anim'))done();},380);
}
document.getElementById('lbNext').onclick=()=>stepLb(1);
document.getElementById('lbPrev').onclick=()=>stepLb(-1);
document.getElementById('lbClose').onclick=()=>lb.classList.remove('on');
document.getElementById('lbRoom').onclick=()=>{const it=lbList[lbIdx];if(it)roomPicker(it);};
document.getElementById('lbDel').onclick=()=>{
  if(!confirm('Remove this image?'))return;
  const it=lbList[lbIdx];
  proj().inspo=proj().inspo.filter(y=>y.id!==it.id);
  lbList=lbList.filter(y=>y.id!==it.id);
  noHist=true;save();noHist=false;
  renderInspo();
  if(!lbList.length){lb.classList.remove('on');return;}
  if(lbIdx>=lbList.length)lbIdx=0;
  fillSlides();
};
document.getElementById('lbSend').onclick=()=>{
  const src=lbList[lbIdx].src;
  const im=imgCache[src];
  const place=(w,h)=>{
    const sc=Math.min(760/w,560/h,1);
    const c=toWorld(W/2,H/2);
    page().items.push({id:uid(),t:'img',src,
      x:c.x-w*sc/2,y:c.y-h*sc/2,w:w*sc,h:h*sc,lock:true});
    save();draw();renderThumbs();syncEmpty();
    lb.classList.remove('on');setMode('board');
    toast('Added to page '+(pageIdx+1));
  };
  if(im)place(im.width,im.height);
  else{const n=new Image();n.onload=()=>{imgCache[src]=n;place(n.width,n.height);};n.src=src;}
};
lb.onclick=e=>{if(e.target===lb||e.target.classList.contains('lbslide'))lb.classList.remove('on');};

/* drag-to-swipe: image follows the finger, next one trails in */
let sx0=null,sy0=null,dragging=false,axis=null;
lb.addEventListener('touchstart',e=>{
  if(e.touches.length!==1)return;
  sx0=e.touches[0].clientX;sy0=e.touches[0].clientY;
  axis=null;dragging=false;
  track.classList.remove('anim');
},{passive:true});
lb.addEventListener('touchmove',e=>{
  if(sx0===null||e.touches.length!==1)return;
  const dx=e.touches[0].clientX-sx0, dy=e.touches[0].clientY-sy0;
  if(!axis){
    if(Math.abs(dx)<6&&Math.abs(dy)<6)return;
    axis=Math.abs(dx)>Math.abs(dy)?'x':'y';
  }
  if(axis!=='x'||lbList.length<2)return;
  dragging=true;
  track.style.transform='translateX('+(-lb.clientWidth+dx)+'px)';
},{passive:true});
lb.addEventListener('touchend',e=>{
  if(sx0===null)return;
  const dx=e.changedTouches[0].clientX-sx0;
  const wasDrag=dragging;
  sx0=null;sy0=null;dragging=false;
  if(!wasDrag||lbList.length<2)return;
  if(Math.abs(dx)>lb.clientWidth*0.22)stepLb(dx<0?1:-1);
  else{track.classList.add('anim');track.style.transform='translateX('+(-lb.clientWidth)+'px)';}
},{passive:true});
