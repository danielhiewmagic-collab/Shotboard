function draw(){
  ctx.save();
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle='#F6F3ED';ctx.fillRect(0,0,W,H);

  const v=view();
  ctx.save();
  ctx.translate(v.x,v.y);ctx.scale(v.z,v.z);

  for(const it of page().items) paint(it);

  if(sel){const it=page().items.find(i=>i.id===sel);if(it)handles(it);}
  if(ghost) paint(ghost,true);

  ctx.restore();
  ctx.restore();
}

function paint(it,isGhost){
  const col=it.done?'#3DD68C':(it.color||'#FF3B30');
  ctx.save();
  ctx.globalAlpha=isGhost?0.65:1;
  ctx.strokeStyle=col;ctx.fillStyle=col;
  ctx.lineCap='round';ctx.lineJoin='round';

  if(it.t==='img'){
    const im=imgCache[it.src]||getImg(it.src);
    if(im){ctx.drawImage(im,it.x,it.y,it.w,it.h);}
    else{ctx.fillStyle='#1F232A';ctx.fillRect(it.x,it.y,it.w,it.h);}
  }
  else if(it.t==='arrow'){
    drawArrow(ctx,it);
  }
  else if(it.t==='cone'){
    drawCone(ctx,it,view().z);
  }
  else if(it.t==='rect'){
    ctx.lineWidth=it.weight||3;
    if(it.dash)ctx.setLineDash([(it.weight||3)*3.2,(it.weight||3)*2.6]);
    if(hasPersp(it)){quadPath(ctx,rectQuad(it));ctx.stroke();}
    else ctx.strokeRect(it.x,it.y,it.w,it.h);
    ctx.setLineDash([]);
    if(it.grid){hasPersp(it)?thirdsQuad(ctx,it):thirds(ctx,it);}
  }
  else if(it.t==='pen'){
    ctx.lineWidth=it.weight||3;
    ctx.beginPath();
    smoothPath(ctx,it.pts);
    ctx.stroke();
  }
  else if(it.t==='text'){
    ctx.font=`600 ${it.size||16}px 'Space Grotesk', sans-serif`;
    ctx.textBaseline='top';
    ctx.fillText(it.txt||'',it.x,it.y);
  }
  ctx.restore();
}


/* Arrow styles: 0 = open chevron (marker style), 1 = solid head, 2 = line only */
function drawArrow(g,it){
  const w=it.weight||3;
  const dx=it.x2-it.x1, dy=it.y2-it.y1;
  const len=Math.hypot(dx,dy)||1;
  const a=Math.atan2(dy,dx);
  const st=it.style||0;
  const head=Math.min(Math.max(w*5.4,18),len*0.5);
  const sp=0.55;
  g.lineWidth=w;
  g.lineCap='round';g.lineJoin='round';

  if(st===2){
    g.beginPath();g.moveTo(it.x1,it.y1);g.lineTo(it.x2,it.y2);g.stroke();
    return;
  }
  if(st===1){
    const ux=dx/len,uy=dy/len;
    g.beginPath();g.moveTo(it.x1,it.y1);g.lineTo(it.x2-ux*head*0.8,it.y2-uy*head*0.8);g.stroke();
    g.beginPath();g.moveTo(it.x2,it.y2);
    g.lineTo(it.x2-head*Math.cos(a-0.42),it.y2-head*Math.sin(a-0.42));
    g.lineTo(it.x2-head*Math.cos(a+0.42),it.y2-head*Math.sin(a+0.42));
    g.closePath();g.fill();
    return;
  }
  // style 0 — full shaft to tip, two open barbs (matches hand-drawn reference)
  g.beginPath();g.moveTo(it.x1,it.y1);g.lineTo(it.x2,it.y2);g.stroke();
  g.beginPath();
  g.moveTo(it.x2-head*Math.cos(a-sp),it.y2-head*Math.sin(a-sp));
  g.lineTo(it.x2,it.y2);
  g.lineTo(it.x2-head*Math.cos(a+sp),it.y2-head*Math.sin(a+sp));
  g.stroke();
}

/* focal cone: full FOV angle in radians from focal length + sensor */
function coneFov(it){
  const half=(it.sensor==='ff')?18:11.75;   // half sensor width, mm
  return 2*Math.atan(half/(it.fmm||24));
}
function conePts(it){
  const dx=it.x2-it.x1,dy=it.y2-it.y1;
  const len=Math.hypot(dx,dy)||1;
  const a=Math.atan2(dy,dx);
  const w=len*Math.tan(coneFov(it)/2);
  const px=-Math.sin(a),py=Math.cos(a);
  return{
    apex:{x:it.x1,y:it.y1},
    e1:{x:it.x2+px*w,y:it.y2+py*w},
    e2:{x:it.x2-px*w,y:it.y2-py*w}
  };
}
/* Perspective frame: tapers stay symmetric about each midline, so the
   shape always reads as a rectangle seen at an angle — never a skewed blob.
   tL/tR = vertical taper at left/right edges   (horizontal perspective)
   tT/tB = horizontal taper at top/bottom edges (vertical perspective)   */
function rectQuad(it){
  const tL=it.tL||0,tR=it.tR||0,tT=it.tT||0,tB=it.tB||0;
  return [
    {x:it.x+tT,        y:it.y+tL},          // TL
    {x:it.x+it.w-tT,   y:it.y+tR},          // TR
    {x:it.x+it.w-tB,   y:it.y+it.h-tR},     // BR
    {x:it.x+tB,        y:it.y+it.h-tL}      // BL
  ];
}
const hasPersp=it=>it.persp&&(it.tL||it.tR||it.tT||it.tB);
const lerp=(a,b,t)=>({x:a.x+(b.x-a.x)*t,y:a.y+(b.y-a.y)*t});

function quadPath(g,q){
  g.beginPath();
  g.moveTo(q[0].x,q[0].y);
  g.lineTo(q[1].x,q[1].y);
  g.lineTo(q[2].x,q[2].y);
  g.lineTo(q[3].x,q[3].y);
  g.closePath();
}
function thirdsQuad(g,it){
  const q=rectQuad(it);
  g.save();
  g.globalAlpha=.45;
  g.lineWidth=Math.max(1,(it.weight||3)*.4);
  g.setLineDash([]);
  g.beginPath();
  [1/3,2/3].forEach(t=>{
    const a=lerp(q[0],q[1],t), b=lerp(q[3],q[2],t);   // verticals
    g.moveTo(a.x,a.y);g.lineTo(b.x,b.y);
    const c=lerp(q[0],q[3],t), d=lerp(q[1],q[2],t);   // horizontals
    g.moveTo(c.x,c.y);g.lineTo(d.x,d.y);
  });
  g.stroke();
  g.restore();
}

function thirds(g,it){
  g.save();
  g.globalAlpha=.45;
  g.lineWidth=Math.max(1,(it.weight||3)*.4);
  g.setLineDash([]);
  g.beginPath();
  g.moveTo(it.x+it.w/3,it.y);g.lineTo(it.x+it.w/3,it.y+it.h);
  g.moveTo(it.x+it.w*2/3,it.y);g.lineTo(it.x+it.w*2/3,it.y+it.h);
  g.moveTo(it.x,it.y+it.h/3);g.lineTo(it.x+it.w,it.y+it.h/3);
  g.moveTo(it.x,it.y+it.h*2/3);g.lineTo(it.x+it.w,it.y+it.h*2/3);
  g.stroke();
  g.restore();
}
function hexA(hex,a){
  const n=parseInt(hex.slice(1),16);
  return 'rgba('+((n>>16)&255)+','+((n>>8)&255)+','+(n&255)+','+a+')';
}
function rr(g,x,y,w,h,r){
  g.beginPath();
  g.moveTo(x+r,y);
  g.arcTo(x+w,y,x+w,y+h,r);
  g.arcTo(x+w,y+h,x,y+h,r);
  g.arcTo(x,y+h,x,y,r);
  g.arcTo(x,y,x+w,y,r);
  g.closePath();
}
function drawCone(g,it,sc){
  sc=sc||1;
  const col=it.done?'#3DD68C':(it.color||'#FF3B30');
  const{apex,e1,e2}=conePts(it);
  const w=it.weight||3;
  const fx=(e1.x+e2.x)/2,fy=(e1.y+e2.y)/2;
  g.save();
  g.lineCap='round';g.lineJoin='round';

  // light falls off from the camera: gradient fill
  const grad=g.createLinearGradient(apex.x,apex.y,fx,fy);
  grad.addColorStop(0,hexA(col,.20));
  grad.addColorStop(.55,hexA(col,.08));
  grad.addColorStop(1,hexA(col,.02));
  g.beginPath();
  g.moveTo(apex.x,apex.y);g.lineTo(e1.x,e1.y);g.lineTo(e2.x,e2.y);g.closePath();
  g.fillStyle=grad;g.fill();

  // side rays: solid
  g.strokeStyle=col;g.lineWidth=w;
  g.beginPath();
  g.moveTo(apex.x,apex.y);g.lineTo(e1.x,e1.y);
  g.moveTo(apex.x,apex.y);g.lineTo(e2.x,e2.y);
  g.stroke();

  // far plane: dashed, lighter — reads as "reach", not a wall
  g.beginPath();g.moveTo(e1.x,e1.y);g.lineTo(e2.x,e2.y);
  g.setLineDash([w*2.6,w*2.4]);
  g.lineWidth=Math.max(1.2,w*.7);g.globalAlpha=.7;
  g.stroke();
  g.setLineDash([]);g.globalAlpha=1;

  // FOV arc at the apex — the angle made visible
  const a=Math.atan2(it.y2-it.y1,it.x2-it.x1);
  const half=coneFov(it)/2;
  const len=Math.hypot(it.x2-it.x1,it.y2-it.y1)||1;
  const ar=Math.min(30/sc,len*.28);
  g.beginPath();g.arc(apex.x,apex.y,ar,a-half,a+half);
  g.lineWidth=Math.max(1.2/sc,w*.4);g.globalAlpha=.5;
  g.strokeStyle=col;g.stroke();
  g.globalAlpha=1;

  // camera body: white ring + colored core
  const aR=Math.max(w*1.2,8/sc), cR=Math.max(w*.55,3.4/sc);
  g.beginPath();g.arc(apex.x,apex.y,aR,0,7);
  g.fillStyle='#FFFFFF';g.fill();
  g.lineWidth=Math.max(w*.6,2.2/sc);g.strokeStyle=col;g.stroke();
  g.beginPath();g.arc(apex.x,apex.y,cR,0,7);
  g.fillStyle=col;g.fill();

  // focal label: floating pill on the axis
  const lx=(it.x1+it.x2)/2, ly=(it.y1+it.y2)/2;
  const lbl=(it.fmm||14)+'mm';
  g.font="700 "+(13/sc)+"px 'Space Grotesk', sans-serif";
  g.textAlign='center';g.textBaseline='middle';
  const tw=g.measureText(lbl).width;
  const pw=tw+20/sc,ph=25/sc;
  g.shadowColor='rgba(30,24,17,.18)';g.shadowBlur=8/sc;g.shadowOffsetY=2/sc;
  rr(g,lx-pw/2,ly-ph/2,pw,ph,ph/2);
  g.fillStyle='rgba(255,255,255,.97)';g.fill();
  g.shadowColor='transparent';g.shadowBlur=0;g.shadowOffsetY=0;
  g.lineWidth=1.2/sc;g.strokeStyle=hexA(col,.4);g.stroke();
  g.fillStyle=col;
  g.fillText(lbl,lx,ly+.5);
  g.restore();
}

function smoothPath(g,pts){
  if(pts.length<3){
    g.moveTo(pts[0].x,pts[0].y);
    for(let i=1;i<pts.length;i++)g.lineTo(pts[i].x,pts[i].y);
    return;
  }
  g.moveTo(pts[0].x,pts[0].y);
  for(let i=1;i<pts.length-1;i++){
    const mx=(pts[i].x+pts[i+1].x)/2, my=(pts[i].y+pts[i+1].y)/2;
    g.quadraticCurveTo(pts[i].x,pts[i].y,mx,my);
  }
  g.lineTo(pts[pts.length-1].x,pts[pts.length-1].y);
}

function bbox(it){
  if(it.t==='rect'&&hasPersp(it)){
    const q=rectQuad(it);
    const xs=q.map(p=>p.x),ys=q.map(p=>p.y);
    return{x:Math.min(...xs),y:Math.min(...ys),
      w:Math.max(...xs)-Math.min(...xs),h:Math.max(...ys)-Math.min(...ys)};
  }
  if(it.t==='cone'){
    const{apex,e1,e2}=conePts(it);
    const xs=[apex.x,e1.x,e2.x],ys=[apex.y,e1.y,e2.y];
    return{x:Math.min(...xs),y:Math.min(...ys),
      w:Math.max(...xs)-Math.min(...xs),h:Math.max(...ys)-Math.min(...ys)};
  }
  if(it.t==='arrow')return{x:Math.min(it.x1,it.x2),y:Math.min(it.y1,it.y2),w:Math.abs(it.x2-it.x1),h:Math.abs(it.y2-it.y1)};
  if(it.t==='pen'){
    const xs=it.pts.map(p=>p.x),ys=it.pts.map(p=>p.y);
    return{x:Math.min(...xs),y:Math.min(...ys),w:Math.max(...xs)-Math.min(...xs),h:Math.max(...ys)-Math.min(...ys)};
  }
  if(it.t==='text'){
    ctx.save();ctx.font=`600 ${it.size||16}px 'Space Grotesk', sans-serif`;
    const w=ctx.measureText(it.txt||'').width;ctx.restore();
    return{x:it.x,y:it.y,w,h:(it.size||16)*1.25};
  }
  return{x:it.x,y:it.y,w:it.w,h:it.h};
}

function handles(it){
  const v=view(),z=v.z;
  const b=bbox(it);
  ctx.save();
  ctx.strokeStyle=it.lock?(shielded(it)?'#8B939F':'#7C879A'):'#5B9DFF';ctx.lineWidth=1.4/z;ctx.setLineDash([5/z,4/z]);
  ctx.strokeRect(b.x-4/z,b.y-4/z,b.w+8/z,b.h+8/z);
  ctx.setLineDash([]);
  if(it.lock){
    const bd=lockBadge(it), R=15/z;
    ctx.beginPath();ctx.arc(bd.x,bd.y,R,0,7);
    ctx.fillStyle='#FFFFFF';ctx.fill();
    ctx.strokeStyle='#8B939F';ctx.lineWidth=1.5/z;ctx.stroke();
    const s=9/z;
    ctx.strokeStyle='#6E655A';ctx.lineWidth=1.9/z;
    ctx.strokeRect(bd.x-s/2,bd.y-s*0.18,s,s*0.62);
    ctx.beginPath();ctx.arc(bd.x,bd.y-s*0.18,s*0.29,Math.PI,0);ctx.stroke();
    if(!shielded(it))paintDelBadge(it);
    ctx.restore();return;
  }

  const r=8/z;
  if(it.t==='rect'&&it.persp){
    // blue tint on any edge currently locked true vertical / horizontal
    const q=rectQuad(it);
    const edges=[
      [(it.tT||0)===0, q[0],q[1]],   // top
      [(it.tR||0)===0, q[1],q[2]],   // right
      [(it.tB||0)===0, q[3],q[2]],   // bottom
      [(it.tL||0)===0, q[0],q[3]]    // left
    ];
    ctx.save();
    ctx.strokeStyle='#5B9DFF';ctx.lineWidth=2.4/z;ctx.globalAlpha=.85;
    ctx.setLineDash([]);
    edges.forEach(([on,a,b])=>{
      if(!on)return;
      ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();
    });
    ctx.restore();
  }
  const pts=(it.t==='rect'&&it.persp)
    ? rectQuad(it)
    : (it.t==='arrow'||it.t==='cone')
    ? [{x:it.x1,y:it.y1},{x:it.x2,y:it.y2}]
    : (it.t==='rect'||it.t==='img')
      ? [{x:it.x,y:it.y},{x:it.x+it.w,y:it.y},{x:it.x,y:it.y+it.h},{x:it.x+it.w,y:it.y+it.h}]
      : [];
  ctx.fillStyle='#fff';ctx.strokeStyle='#5B9DFF';ctx.lineWidth=1.6/z;
  for(const p of pts){ctx.beginPath();ctx.arc(p.x,p.y,r,0,7);ctx.fill();ctx.stroke();}

  // open padlock badge (tap to lock)
  const bd=lockBadge(it), BR=15/z;
  ctx.beginPath();ctx.arc(bd.x,bd.y,BR,0,7);
  ctx.fillStyle='#FFFFFF';ctx.fill();
  ctx.strokeStyle='#5B9DFF';ctx.lineWidth=1.5/z;ctx.stroke();
  const ls=9/z;
  ctx.strokeStyle='#6E655A';ctx.lineWidth=1.9/z;
  ctx.strokeRect(bd.x-ls/2,bd.y-ls*0.18,ls,ls*0.62);
  ctx.beginPath();ctx.arc(bd.x+ls*0.42,bd.y-ls*0.18,ls*0.29,Math.PI,0);ctx.stroke();
  paintDelBadge(it);

  // move grip above the shape
  const g=grip(it);
  ctx.beginPath();ctx.arc(g.x,g.y,11/z,0,7);
  ctx.fillStyle='#5B9DFF';ctx.fill();
  ctx.strokeStyle='#fff';ctx.lineWidth=2/z;
  ctx.beginPath();
  ctx.moveTo(g.x-4/z,g.y);ctx.lineTo(g.x+4/z,g.y);
  ctx.moveTo(g.x,g.y-4/z);ctx.lineTo(g.x,g.y+4/z);
  ctx.stroke();
  ctx.restore();
}
function lockBadge(it){const b=bbox(it),z=view().z;return{x:b.x+b.w+18/z,y:b.y-18/z};}
function delBadge(it){const b=lockBadge(it),z=view().z;return{x:b.x,y:b.y+34/z};}
function paintDelBadge(it){
  const z=view().z,d=delBadge(it),R=15/z;
  ctx.beginPath();ctx.arc(d.x,d.y,R,0,7);
  ctx.fillStyle='#FFFFFF';ctx.fill();
  ctx.strokeStyle='#FF3B30';ctx.lineWidth=1.5/z;ctx.stroke();
  const k=4.6/z;
  ctx.strokeStyle='#FF3B30';ctx.lineWidth=1.9/z;
  ctx.beginPath();
  ctx.moveTo(d.x-k,d.y-k);ctx.lineTo(d.x+k,d.y+k);
  ctx.moveTo(d.x+k,d.y-k);ctx.lineTo(d.x-k,d.y+k);
  ctx.stroke();
}
function grip(it){const b=bbox(it),z=view().z;return{x:b.x+b.w/2,y:b.y-28/z};}

/* ==========================================================
   Hit testing
   ========================================================== */
function distSeg(px,py,x1,y1,x2,y2){
  const dx=x2-x1,dy=y2-y1;const L=dx*dx+dy*dy;
  let t=L?((px-x1)*dx+(py-y1)*dy)/L:0;t=Math.max(0,Math.min(1,t));
  return Math.hypot(px-(x1+t*dx),py-(y1+t*dy));
}
function hit(it,p,tol){
  if(it.t==='cone'){
    const{apex,e1,e2}=conePts(it);
    const sign=(a,b,c)=>(p.x-c.x)*(b.y-c.y)-(b.x-c.x)*(p.y-c.y);
    const d1=sign(p,e1,apex),d2=sign(p,e2,e1),d3=sign(p,apex,e2);
    const neg=(d1<0)||(d2<0)||(d3<0), pos=(d1>0)||(d2>0)||(d3>0);
    if(!(neg&&pos))return true;
    const t=tol+(it.weight||3);
    return distSeg(p.x,p.y,apex.x,apex.y,e1.x,e1.y)<=t
        || distSeg(p.x,p.y,apex.x,apex.y,e2.x,e2.y)<=t
        || distSeg(p.x,p.y,e1.x,e1.y,e2.x,e2.y)<=t;
  }
  if(it.t==='arrow')return distSeg(p.x,p.y,it.x1,it.y1,it.x2,it.y2)<=tol+(it.weight||3);
  if(it.t==='pen'){
    for(let i=1;i<it.pts.length;i++)
      if(distSeg(p.x,p.y,it.pts[i-1].x,it.pts[i-1].y,it.pts[i].x,it.pts[i].y)<=tol+(it.weight||3))return true;
    return false;
  }
  if(it.t==='rect'){
    const t=tol+(it.weight||3);
    if(hasPersp(it)){
      const q=rectQuad(it);
      for(let i=0;i<4;i++){
        const a=q[i],b=q[(i+1)%4];
        if(distSeg(p.x,p.y,a.x,a.y,b.x,b.y)<=t)return true;
      }
      return false;
    }
    const inO=p.x>=it.x-t&&p.x<=it.x+it.w+t&&p.y>=it.y-t&&p.y<=it.y+it.h+t;
    const inI=p.x>=it.x+t&&p.x<=it.x+it.w-t&&p.y>=it.y+t&&p.y<=it.y+it.h-t;
    return inO&&!inI;
  }
  const b=bbox(it);
  return p.x>=b.x-tol&&p.x<=b.x+b.w+tol&&p.y>=b.y-tol&&p.y<=b.y+b.h+tol;
}
// Lock only shields images from erase/mark. Annotations remain targetable when locked.
const shielded=it=>it.lock&&it.t==='img';

function pick(p,tol,skipLocked){
  const its=page().items;
  for(let i=its.length-1;i>=0;i--){
    if(skipLocked&&shielded(its[i]))continue;
    if(hit(its[i],p,tol))return its[i];
  }
  return null;
}
function pickMark(p,tol){
  const its=page().items;
  for(let i=its.length-1;i>=0;i--){
    const it=its[i];
    if(shielded(it))continue;
    if(hit(it,p,tol))return it;
  }
  return null;
}

/* ==========================================================
   FX layer — pulses + confetti
   ========================================================== */
const fx=document.getElementById('fx');
const fctx=fx.getContext('2d');
let pulses=[],confetti=[],fxRun=false;

function fxResize(){fx.width=Math.round(W*DPR);fx.height=Math.round(H*DPR);}
function pulse(wx,wy,color){
  const p=toScreen(wx,wy);
  pulses.push({x:p.x,y:p.y,t:0,color});
  fxKick();
}
function boom(){
  const cols=['#FF3B30','#FFC24B','#3DD68C','#F5EFE7','#5B9DFF'];
  for(let i=0;i<90;i++){
    const a=Math.random()*Math.PI*2, sp=3+Math.random()*7.5;
    confetti.push({
      x:W/2,y:H*0.36,
      vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-3.2,
      rot:Math.random()*Math.PI,vr:(Math.random()-.5)*0.3,
      w:5+Math.random()*6,h:3+Math.random()*4,
      col:cols[i%cols.length],life:0
    });
  }
  fxKick();
}
function fxKick(){if(!fxRun){fxRun=true;requestAnimationFrame(fxTick);}}
function fxTick(){
  fctx.setTransform(DPR,0,0,DPR,0,0);
  fctx.clearRect(0,0,W,H);
  pulses=pulses.filter(p=>p.t<1);
  for(const p of pulses){
    p.t+=0.055;
    fctx.beginPath();
    fctx.arc(p.x,p.y,8+p.t*36,0,7);
    fctx.strokeStyle=p.color;
    fctx.globalAlpha=(1-p.t)*0.85;
    fctx.lineWidth=3*(1-p.t)+0.5;
    fctx.stroke();
  }
  fctx.globalAlpha=1;
  confetti=confetti.filter(c=>c.life<160&&c.y<H+30);
  for(const c of confetti){
    c.life++;c.x+=c.vx;c.y+=c.vy;c.vy+=0.16;c.vx*=0.99;c.rot+=c.vr;
    fctx.save();
    fctx.translate(c.x,c.y);fctx.rotate(c.rot);
    fctx.globalAlpha=c.life>120?(160-c.life)/40:1;
    fctx.fillStyle=c.col;
    fctx.fillRect(-c.w/2,-c.h/2,c.w,c.h);
    fctx.restore();
  }
  fctx.globalAlpha=1;
  if(pulses.length||confetti.length)requestAnimationFrame(fxTick);
  else{fxRun=false;fctx.clearRect(0,0,W,H);}
}

/* ==========================================================
   Shot progress
   ========================================================== */
const celebrated=new Set();
function pageShots(pg){
  const sh=pg.items.filter(i=>i.t==='rect'||i.t==='arrow'||i.t==='cone');
  return{t:sh.length,d:sh.filter(i=>i.done).length};
}
function pageBreak(pg){
  const c={rect:0,arrow:0,cone:0,done:0};
  pg.items.forEach(i=>{
    if(i.t==='rect'||i.t==='arrow'||i.t==='cone'){c[i.t]++;if(i.done)c.done++;}
  });
  c.total=c.rect+c.arrow+c.cone;
  return c;
}
const KIND_LABEL={plan:'Plan',elev:'Elevation'};
function blank(){return{rect:0,arrow:0,cone:0,done:0,total:0,pages:0};}
function addTo(t,c){t.rect+=c.rect;t.arrow+=c.arrow;t.cone+=c.cone;t.done+=c.done;t.total+=c.total;if(c.total)t.pages++;}
function projBreak(){
  const t=blank(), plan=blank(), elev=blank(), un=blank();
  proj().pages.forEach(pg=>{
    const c=pageBreak(pg);
    addTo(t,c);
    if(pg.kind==='plan')addTo(plan,c);
    else if(pg.kind==='elev')addTo(elev,c);
    else addTo(un,c);
  });
  t.plan=plan;t.elev=elev;t.untyped=un;
  return t;
}
function syncProgress(){
  const{t,d}=pageShots(page());
  const P2=projBreak();
  const pill=document.getElementById('progPill');
  pill.classList.toggle('on',t>0||P2.total>0);
  pill.classList.toggle('full',t>0&&d===t);
  document.getElementById('progFill').style.width=t?Math.round(d/t*100)+'%':'0';
  const k=page().kind;
  let tail='';
  if(k==='plan'&&P2.plan.total)tail='  ·  '+P2.plan.total+' plan';
  else if(k==='elev'&&P2.elev.total)tail='  ·  '+P2.elev.total+' elev';
  else if(P2.total)tail='  ·  '+P2.total+' total';
  document.getElementById('progTxt').textContent=d+'/'+t+tail;
  const id=page().id;
  if(t>0&&d===t){
    if(!celebrated.has(id)&&mode==='board'){celebrated.add(id);boom();toast('All shots captured on this page');}
  }else celebrated.delete(id);
}

/* ==========================================================
   Pointer handling
   ========================================================== */
let ghost=null;
let act=null;
let dtT=0;
let itemTap={id:null,t:0};

/* snap a vector to horizontal/vertical when within 8 degrees */
function hvSnap(ax,ay,px,py){
  const dx=px-ax, dy=py-ay;
  const T=Math.tan(8*Math.PI/180);
  if(Math.abs(dy)<=Math.abs(dx)*T)return{x:px,y:ay};
  if(Math.abs(dx)<=Math.abs(dy)*T)return{x:ax,y:py};
  return null;
}
const ptrs=new Map();
let pinch=null;

cv.addEventListener('pointerdown',e=>{
  cv.setPointerCapture(e.pointerId);
  ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(ptrs.size===2){startPinch();act=null;ghost=null;draw();return;}
  if(ptrs.size>2)return;

  const r=cv.getBoundingClientRect();
  const sp={x:e.clientX-r.left,y:e.clientY-r.top};
  const p=toWorld(sp.x,sp.y);
  const tol=18/view().z;

  // lock/unlock badge on the selected item — always checked first
  if(sel){
    const si=page().items.find(i=>i.id===sel);
    if(si){
      const dd=delBadge(si);
      if(!(si.t==='img'&&si.lock)&&Math.hypot(p.x-dd.x,p.y-dd.y)<=19/view().z){
        const bb=bbox(si);
        pulse(bb.x+bb.w/2,bb.y+bb.h/2,'#FF3B30');
        page().items=page().items.filter(i=>i.id!==sel);
        sel=null;save();showOpts();draw();renderThumbs();syncEmpty();
        return;
      }
      const bd=lockBadge(si);
      if(Math.hypot(p.x-bd.x,p.y-bd.y)<=19/view().z){
        si.lock=!si.lock;
        toast(si.lock?'Locked':'Unlocked');
        save();showOpts();draw();return;
      }
    }
  }

  if(tool==='pan'){act={k:'pan',sx:e.clientX,sy:e.clientY,vx:view().x,vy:view().y};return;}

  if(tool==='select'){
    if(sel){
      const it=page().items.find(i=>i.id===sel);
      if(it&&!it.lock){
        const g=grip(it);
        if(Math.hypot(p.x-g.x,p.y-g.y)<=17/view().z){
          act={k:'move',it,p};return;
        }
        const h=grabHandle(it,p);
        if(h){act={k:'resize',it,h,p,o:JSON.parse(JSON.stringify(it))};return;}
      }
    }
    const it=pick(p,tol,true)||pick(p,tol);
    if(!it){
      const now=Date.now();
      if(now-dtT<320){fitPage();toast('Fit to page');dtT=0;}
      else dtT=now;
    }
    if(it&&it.t!=='img'){
      const nowT=Date.now();
      if(itemTap.id===it.id&&nowT-itemTap.t<340){
        itemTap={id:null,t:0};
        it.done=!it.done;
        const bb=bbox(it);
        pulse(bb.x+bb.w/2,bb.y+bb.h/2,it.done?'#3DD68C':'#A89E92');
        sel=it.id;act=null;
        save();showOpts();draw();renderThumbs();
        return;
      }
      itemTap={id:it.id,t:nowT};
    }
    sel=it?it.id:null;
    if(it&&!it.lock)act={k:'move',it,p};
    else act=null;
    showOpts();draw();return;
  }

  if(tool==='arrow'||tool==='rect'||tool==='cone'){
    // if a shape is already selected, let its handles/grip win
    if(sel){
      const it=page().items.find(i=>i.id===sel);
      if(it&&!it.lock){
        const g=grip(it);
        if(Math.hypot(p.x-g.x,p.y-g.y)<=16/view().z){act={k:'move',it,p};return;}
        const hh=grabHandle(it,p);
        if(hh){act={k:'resize',it,h:hh,p,o:JSON.parse(JSON.stringify(it))};return;}
      }
    }
    // tapping an existing unlocked shape picks it up rather than drawing a new one
    const existing=pick(p,16/view().z,true);
    if(existing&&existing.t!=='img'){
      const nowT=Date.now();
      if(itemTap.id===existing.id&&nowT-itemTap.t<340){
        itemTap={id:null,t:0};
        existing.done=!existing.done;
        const bb=bbox(existing);
        pulse(bb.x+bb.w/2,bb.y+bb.h/2,existing.done?'#3DD68C':'#A89E92');
        sel=existing.id;act=null;
        save();showOpts();draw();renderThumbs();
        return;
      }
      itemTap={id:existing.id,t:nowT};
      sel=existing.id;
      if(!existing.lock)act={k:'move',it:existing,p};
      showOpts();draw();return;
    }
  }
  if(tool==='arrow'){sel=null;ghost={t:'arrow',x1:p.x,y1:p.y,x2:p.x,y2:p.y,weight:opt.weight,style:opt.style,color:'#FF3B30'};act={k:'arrow'};return;}
  if(tool==='cone'){sel=null;ghost={t:'cone',x1:p.x,y1:p.y,x2:p.x,y2:p.y,fmm:opt.fmm,sensor:opt.sensor,weight:opt.weight,color:'#FF3B30'};act={k:'cone'};return;}
  if(tool==='rect'){sel=null;ghost={t:'rect',x:p.x,y:p.y,w:0,h:0,dash:opt.dash,grid:opt.grid,weight:opt.weight,color:'#FF3B30'};act={k:'rect',ox:p.x,oy:p.y};return;}
  if(tool==='pen'){ghost={t:'pen',pts:[p],weight:opt.weight,color:'#FF3B30'};act={k:'pen'};return;}
  if(tool==='erase'){sel=null;act={k:'erase'};doErase(p,tol);showOpts();return;}
  if(tool==='mark'){sel=null;act={k:'mark',seen:new Set()};doMark(p,tol,act.seen);showOpts();return;}
  if(tool==='text'){
    const t=prompt('Text');
    if(t&&t.trim()){page().items.push({id:uid(),t:'text',txt:t.trim(),x:p.x,y:p.y,size:opt.size,color:'#FF3B30'});save();draw();renderThumbs();syncEmpty();}
    return;
  }
});

cv.addEventListener('pointermove',e=>{
  if(ptrs.has(e.pointerId))ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(ptrs.size>=2&&pinch){doPinch();return;}
  if(!act)return;

  const r=cv.getBoundingClientRect();
  const p=toWorld(e.clientX-r.left,e.clientY-r.top);
  const tol=12/view().z;

  switch(act.k){
    case 'pan':{
      const v=view();
      v.x=act.vx+(e.clientX-act.sx);
      v.y=act.vy+(e.clientY-act.sy);
      break;
    }
    case 'arrow':{
      const sn=hvSnap(ghost.x1,ghost.y1,p.x,p.y);
      ghost.x2=sn?sn.x:p.x; ghost.y2=sn?sn.y:p.y;
      break;
    }
    case 'cone':{
      const sn=hvSnap(ghost.x1,ghost.y1,p.x,p.y);
      ghost.x2=sn?sn.x:p.x; ghost.y2=sn?sn.y:p.y;
      break;
    }
    case 'rect':{
      let w=p.x-act.ox,h=p.y-act.oy;
      let R=ratioOf(opt.ratio);
      if(R){
        // orientation snap: drag mostly vertical -> portrait, mostly horizontal -> landscape
        const portrait=Math.abs(h)>Math.abs(w);
        if(portrait&&R<1)R=1/R;
        if(!portrait&&R>1)R=1/R;
        ghost.ratioUsed=portrait?'portrait':'landscape';
        const m=Math.max(Math.abs(w),Math.abs(h)/R);
        w=Math.sign(w||1)*m; h=Math.sign(h||1)*m*R;
      }
      ghost.x=w<0?act.ox+w:act.ox;
      ghost.y=h<0?act.oy+h:act.oy;
      ghost.w=Math.abs(w);ghost.h=Math.abs(h);
      break;
    }
    case 'pen':{
      const last=ghost.pts[ghost.pts.length-1];
      if(Math.hypot(p.x-last.x,p.y-last.y)>1.4/view().z)ghost.pts.push(p);
      break;
    }
    case 'move':{
      const dx=p.x-act.p.x,dy=p.y-act.p.y;
      moveItem(act.it,dx,dy);
      act.p=p;
      break;
    }
    case 'resize': doResize(act,p);break;
    case 'erase': doErase(p,tol);break;
    case 'mark': doMark(p,tol,act.seen);break;
  }
  draw();
});

function endPtr(e){
  ptrs.delete(e.pointerId);
  if(ptrs.size<2)pinch=null;
  if(!act)return;
  if(act.k==='arrow'||act.k==='cone'){
    if(Math.hypot(ghost.x2-ghost.x1,ghost.y2-ghost.y1)>9/view().z){
      const a={id:uid(),...ghost};page().items.push(a);sel=a.id;save();showOpts();
    }
  }
  if(act.k==='rect'){
    if(ghost.w>9/view().z&&ghost.h>9/view().z){
      const r={id:uid(),...ghost};
      if(opt.ratio!=='free')r.lockR=ghost.h/ghost.w;
      page().items.push(r);sel=r.id;save();showOpts();
    }
  }
  if(act.k==='pen'){
    if(ghost.pts.length>1){page().items.push({id:uid(),...ghost});save();}
  }
  if(act.k==='move'||act.k==='resize'||act.k==='erase'||act.k==='mark')save();
  if(act.k==='pan'){noHist=true;save();noHist=false;}
  ghost=null;act=null;
  draw();renderThumbs();syncEmpty();
}
cv.addEventListener('pointerup',endPtr);
cv.addEventListener('pointercancel',endPtr);
cv.addEventListener('pointerleave',e=>{if(act&&act.k!=='pan')endPtr(e);});

function moveItem(it,dx,dy){
  if(it.t==='arrow'||it.t==='cone'){it.x1+=dx;it.y1+=dy;it.x2+=dx;it.y2+=dy;}
  else if(it.t==='pen'){it.pts.forEach(p=>{p.x+=dx;p.y+=dy;});}
  else{it.x+=dx;it.y+=dy;}
}

function grabHandle(it,p){
  const t=20/view().z;
  if(it.t==='arrow'||it.t==='cone'){
    if(Math.hypot(p.x-it.x1,p.y-it.y1)<t)return'a';
    if(Math.hypot(p.x-it.x2,p.y-it.y2)<t)return'b';
    return null;
  }
  if(it.t==='rect'&&it.persp){
    const q=rectQuad(it);
    const names=['tl','tr','br','bl'];
    for(let i=0;i<4;i++) if(Math.hypot(p.x-q[i].x,p.y-q[i].y)<t)return 'P'+names[i];
  }
  if(it.t==='rect'||it.t==='img'){
    const c=[['tl',it.x,it.y],['tr',it.x+it.w,it.y],['bl',it.x,it.y+it.h],['br',it.x+it.w,it.y+it.h]];
    for(const[k,x,y]of c) if(Math.hypot(p.x-x,p.y-y)<t)return k;
  }
  return null;
}

function doResize(a,p){
  const it=a.it,o=a.o;
  if(typeof a.h==='string'&&a.h.startsWith('P')){
    const corner=a.h.slice(1);
    const maxV=o.h*0.44, maxH=o.w*0.44;
    const cl=(v,m)=>Math.max(-m,Math.min(m,v));
    // soft snap: within ~9 screen px of zero taper, the edge locks true vertical/horizontal
    const snapPx=9/view().z;
    const snap=v=>(opt.psnap&&Math.abs(v)<snapPx)?0:v;
    if(corner==='tl'||corner==='bl'){
      // left edge: vertical taper (symmetric about the horizontal midline)
      const dy = corner==='tl' ? (p.y-(o.y+(o.tL||0))) : ((o.y+o.h-(o.tL||0))-p.y);
      it.tL=snap(cl((o.tL||0)+dy,maxV));
    }else{
      const dy = corner==='tr' ? (p.y-(o.y+(o.tR||0))) : ((o.y+o.h-(o.tR||0))-p.y);
      it.tR=snap(cl((o.tR||0)+dy,maxV));
    }
    if(corner==='tl'||corner==='tr'){
      // top edge: horizontal taper (symmetric about the vertical midline)
      const dx = corner==='tl' ? (p.x-(o.x+(o.tT||0))) : ((o.x+o.w-(o.tT||0))-p.x);
      it.tT=snap(cl((o.tT||0)+dx,maxH));
    }else{
      const dx = corner==='bl' ? (p.x-(o.x+(o.tB||0))) : ((o.x+o.w-(o.tB||0))-p.x);
      it.tB=snap(cl((o.tB||0)+dx,maxH));
    }
    return;
  }
  if(it.t==='arrow'||it.t==='cone'){
    if(a.h==='a'){
      const sn=hvSnap(it.x2,it.y2,p.x,p.y);
      it.x1=sn?sn.x:p.x; it.y1=sn?sn.y:p.y;
    }else{
      const sn=hvSnap(it.x1,it.y1,p.x,p.y);
      it.x2=sn?sn.x:p.x; it.y2=sn?sn.y:p.y;
    }
    return;
  }
  const lock = it.t==='rect' ? (it.lockR||null) : (o.h/o.w);
  let ax,ay;
  if(a.h==='br'){ax=o.x;ay=o.y;}
  else if(a.h==='bl'){ax=o.x+o.w;ay=o.y;}
  else if(a.h==='tr'){ax=o.x;ay=o.y+o.h;}
  else{ax=o.x+o.w;ay=o.y+o.h;}
  let w=p.x-ax,h=p.y-ay;
  if(lock){
    const m=Math.max(Math.abs(w),Math.abs(h)/lock);
    w=Math.sign(w||1)*m;h=Math.sign(h||1)*m*lock;
  }
  it.x=w<0?ax+w:ax; it.y=h<0?ay+h:ay;
  it.w=Math.max(Math.abs(w),6); it.h=Math.max(Math.abs(h),6);
}

function doErase(p,tol){
  const it=pick(p,tol,true);
  if(it){
    const b=bbox(it);
    pulse(b.x+b.w/2,b.y+b.h/2,'#FF3B30');
    page().items=page().items.filter(i=>i.id!==it.id);
    if(sel===it.id){sel=null;showOpts();}
  }
}
function doMark(p,tol,seen){
  const it=pickMark(p,tol);
  if(it&&!seen.has(it.id)){
    seen.add(it.id);it.done=!it.done;
    const b=bbox(it);
    pulse(b.x+b.w/2,b.y+b.h/2,it.done?'#3DD68C':'#A89E92');
  }
}

/* Pinch zoom */
function startPinch(){
  const[a,b]=[...ptrs.values()];
  const r=cv.getBoundingClientRect();
  pinch={d:Math.hypot(a.x-b.x,a.y-b.y),z:view().z,
    cx:(a.x+b.x)/2-r.left,cy:(a.y+b.y)/2-r.top,
    vx:view().x,vy:view().y};
}
function doPinch(){
  const[a,b]=[...ptrs.values()];
  const r=cv.getBoundingClientRect();
  const d=Math.hypot(a.x-b.x,a.y-b.y);
  const mx=(a.x+b.x)/2-r.left, my=(a.y+b.y)/2-r.top;
  if(!pinch.d)return;
  const nz=Math.max(0.15,Math.min(7,pinch.z*(d/pinch.d)));
  const v=view();
  const k=nz/pinch.z;
  v.z=nz;
  // zoom about original midpoint, then translate by midpoint drift = two-finger pan
  v.x=pinch.cx-(pinch.cx-pinch.vx)*k + (mx-pinch.cx);
  v.y=pinch.cy-(pinch.cy-pinch.vy)*k + (my-pinch.cy);
  draw();
}

cv.addEventListener('wheel',e=>{
  e.preventDefault();
  const r=cv.getBoundingClientRect();
  const mx=e.clientX-r.left,my=e.clientY-r.top;
  const v=view();
  const k=Math.exp(-e.deltaY*0.0016);
  const nz=Math.max(0.15,Math.min(7,v.z*k));
  const rk=nz/v.z;
  v.x=mx-(mx-v.x)*rk;v.y=my-(my-v.y)*rk;v.z=nz;
  draw();
},{passive:false});

const ratioOf=r=>r==='3:2'?2/3:r==='16:9'?9/16:r==='4:5'?5/4:r==='7:5'?5/7:r==='1:1'?1:null;

/* small label under the rect/arrow icons showing current setting */
function badges(){
  const r=document.querySelector('.tool[data-tool="rect"]');
  const a=document.querySelector('.tool[data-tool="arrow"]');
  r.dataset.badge = opt.ratio==='free' ? 'FR' : opt.ratio.replace(':','');
  a.dataset.badge = ['CHV','SLD','LIN'][opt.style];
  const cn=document.querySelector('.tool[data-tool="cone"]');
  if(cn)cn.dataset.badge=opt.fmm+'';
}


/* Which named ratio does this rect currently match (either orientation)? */
function ratioTag(it){
  if(!it.w||!it.h)return 'free';
  const r=it.h/it.w;
  for(const name of RATIOS){
    const R=ratioOf(name);
    if(!R)continue;
    if(Math.abs(r-R)<0.02||Math.abs(r-1/R)<0.02)return name;
  }
  return 'free';
}

/* Re-shape a rect to a named ratio, keeping centre, area and orientation */
function applyRatio(it,name){
  const R=ratioOf(name);
  const cx=it.x+it.w/2, cy=it.y+it.h/2;
  if(!R){it.lockR=null;showOpts();draw();return;}
  const portrait=it.h>=it.w;
  const target=portrait ? Math.max(R,1/R) : Math.min(R,1/R);
  const area=Math.max(it.w*it.h,400);
  const nw=Math.sqrt(area/target), nh=nw*target;
  it.w=nw; it.h=nh;
  it.x=cx-nw/2; it.y=cy-nh/2;
  it.lockR=target;
}

    if(selIt.t!=='img')h+=`<button class="opt" data-a="done">${selIt.done?'Unmark':'Mark done'}</button>`;
    if(!selIt.lock){
      if(selIt.t==='rect'){

        RATIOS.forEach(r=>{
          h+=`<button class="opt ${ratioTag(selIt)===r?'on':''}" data-sr="${r}">${r}</button>`;
        });
        h+=`<span class="optdiv"></span>`;
        h+=`<button class="opt" data-a="flip">Rotate 90°</button>`;
        h+=`<button class="opt ${!selIt.dash?'on':''}" data-sd="0">Solid</button>`;
        h+=`<button class="opt ${selIt.dash?'on':''}" data-sd="1">Dashed</button>`;
        h+=`<button class="opt ${selIt.grid?'on':''}" data-sg="1">${selIt.grid?'Grid on':'Grid off'}</button>`;
        h+='<span class="optdiv"></span>';
        h+=`<button class="opt ${selIt.persp?'on':''}" data-sp="1">${selIt.persp?'◱ Perspective':'Perspective'}</button>`;
        if(selIt.persp){
          h+=`<button class="opt ${opt.psnap?'on':''}" data-sn="1">${opt.psnap?'Snap on':'Free'}</button>`;
        }
        if(selIt.persp&&(selIt.tL||selIt.tR||selIt.tT||selIt.tB))
          h+=`<button class="opt" data-spr="1">Reset shape</button>`;
      }
      if(selIt.t==='arrow'){
        h+='<span class="optdiv"></span><span class="optlab">Head</span>';

      }
      if(selIt.t==='cone'){
        h+='<span class="optdiv"></span><span class="optlab">Focal</span>';
        focalList(selIt.sensor||'apsc').forEach(f=>{h+=`<button class="opt ${(selIt.fmm||14)===f?'on':''}" data-scf="${f}">${f}mm</button>`;});

  bar.innerHTML=h;
  bar.classList.toggle('hide',!h);
  if(typeof syncTrash==='function')syncTrash();
  bar.querySelectorAll('.opt').forEach(b=>{

      if(d.g){opt.grid=!opt.grid;}
      if(selIt&&d.sg){selIt.grid=!selIt.grid;save();renderThumbs();}
      if(selIt&&d.sp){

        if(!selIt.persp){selIt.tL=selIt.tR=selIt.tT=selIt.tB=0;}

        toast(selIt.persp?'Drag the corners to match the angle':'Back to square');

      if(d.sn){
        opt.psnap=!opt.psnap;
        toast(opt.psnap?'Snapping to vertical / horizontal':'Free adjust — no snapping');
      }
      if(selIt&&d.spr){
        selIt.tL=selIt.tR=selIt.tT=selIt.tB=0;save();renderThumbs();
      }
      if(d.w){opt.weight=+d.w;}
      if(d.s){opt.size=+d.s;}
      if(d.st!==undefined&&d.st!==''){opt.style=+d.st;}
      if(d.cf){opt.fmm=+d.cf;}
      if(d.cs){opt.sensor=d.cs;opt.fmm=snapFocal(opt.fmm,d.cs);}
      if(selIt&&d.scf){selIt.fmm=+d.scf;save();renderThumbs();}
      if(selIt&&d.scs){selIt.sensor=d.scs;selIt.fmm=snapFocal(selIt.fmm||14,d.scs);save();renderThumbs();}
      if(selIt&&d.sr){applyRatio(selIt,d.sr);save();renderThumbs();}
      if(selIt&&d.sd!==undefined&&d.sd!==''){selIt.dash=d.sd==='1';save();renderThumbs();}
      if(selIt&&d.ss!==undefined&&d.ss!==''){selIt.style=+d.ss;save();renderThumbs();}
      if(selIt&&d.sw){selIt.weight=+d.sw;save();renderThumbs();}
      if(d.a&&selIt){
        const its=page().items;
        if(d.a==='lock'){selIt.lock=!selIt.lock;}
        if(d.a==='del'){page().items=its.filter(i=>i.id!==sel);sel=null;}
        if(d.a==='done'){
          selIt.done=!selIt.done;
          const bb=bbox(selIt);
          pulse(bb.x+bb.w/2,bb.y+bb.h/2,selIt.done?'#3DD68C':'#A89E92');
        }
        if(d.a==='front'){page().items=its.filter(i=>i.id!==sel).concat(selIt);}
        if(d.a==='flip'){
          const cx=selIt.x+selIt.w/2, cy=selIt.y+selIt.h/2;
          const nw=selIt.h, nh=selIt.w;
          selIt.x=cx-nw/2; selIt.y=cy-nh/2; selIt.w=nw; selIt.h=nh;
          if(selIt.lockR)selIt.lockR=nh/nw;
        }
        if(d.a==='dup'){
          const c=JSON.parse(JSON.stringify(selIt));c.id=uid();
          moveItem(c,18,18);page().items.push(c);sel=c.id;
        }
        save();renderThumbs();syncEmpty();
      }
      badges();showOpts();draw();
    };
  });
}

document.getElementById('btnFit').onclick=fitPage;
function fitPage(){
  const its=page().items;
  const v=view();
  if(!its.length){v.x=0;v.y=0;v.z=1;draw();return;}
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  for(const it of its){const b=bbox(it);x0=Math.min(x0,b.x);y0=Math.min(y0,b.y);x1=Math.max(x1,b.x+b.w);y1=Math.max(y1,b.y+b.h);}
  const pad=40;
  const z=Math.max(0.15,Math.min(4,Math.min((W-pad*2)/Math.max(x1-x0,1),(H-pad*2)/Math.max(y1-y0,1))));
  v.z=z;
  v.x=W/2-((x0+x1)/2)*z;
  v.y=H/2-((y0+y1)/2)*z;
  draw();noHist=true;save();noHist=false;
}

    if(Math.abs(dx)>6)dragSt.moved=true;
    if(!dragSt.moved)return;
    const w=Math.max(140,Math.min(440,dragSt.w+dx));
    refsEl.style.setProperty('--refw',w+'px');
    liveResize();
  });
  const end=()=>{
    if(!dragSt)return;
    refsEl.classList.remove('dragging');
    if(!dragSt.moved){toggleRefs();}
    else{
      const w=parseFloat(getComputedStyle(refsEl).getPropertyValue('--refw'))||210;
      try{localStorage.setItem('sb.refw',Math.round(w));}catch(e){}
      setTimeout(resize,60);
    }
    dragSt=null;
  };
  tog.addEventListener('pointerup',end);
  tog.addEventListener('pointercancel',end);
})();

      if(ev.target!==d&&ev.target.tagName!=='CANVAS')return;

      if(Math.hypot(ev.clientX-psx,ev.clientY-psy)>9){pmoved=true;clearTimeout(plp);}

    ['pointerup','pointercancel','pointerleave'].forEach(evn=>

    let lp=null,dragging=false;

      lp=setTimeout(()=>{dragging=true;d.classList.add('drag');},420);
    },{passive:true});

    },{passive:false});
    d.addEventListener('touchend',()=>{clearTimeout(lp);dragging=false;d.classList.remove('drag');},{passive:true});
    L.appendChild(d);
  });
  if(typeof syncProgress==='function')syncProgress();
  if(typeof renderRefs==='function')renderRefs();
}

function thumbPaint(c,pg){
  const g=c.getContext('2d');
  g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);
  if(!pg.items.length)return;
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  for(const it of pg.items){const b=bbox(it);x0=Math.min(x0,b.x);y0=Math.min(y0,b.y);x1=Math.max(x1,b.x+b.w);y1=Math.max(y1,b.y+b.h);}
  const z=Math.min(c.width/Math.max(x1-x0,1),c.height/Math.max(y1-y0,1))*0.9;
  g.save();
  g.translate(c.width/2,c.height/2);g.scale(z,z);g.translate(-(x0+x1)/2,-(y0+y1)/2);
  const oc=ctx.canvas,octx=ctx;
  paintInto(g,pg.items);
  g.restore();
}

function paintInto(g,items){
  const old=ctx.__g;
  for(const it of items){
    const col=it.done?'#3DD68C':(it.color||'#FF3B30');
    g.save();g.strokeStyle=col;g.fillStyle=col;g.lineCap='round';g.lineJoin='round';
    if(it.t==='img'){const im=imgCache[it.src];if(im)g.drawImage(im,it.x,it.y,it.w,it.h);else{g.fillStyle='#E5E7EA';g.fillRect(it.x,it.y,it.w,it.h);}}
    else if(it.t==='arrow'){drawArrow(g,it);}
    else if(it.t==='cone'){drawCone(g,it);}
    else if(it.t==='rect'){
      g.lineWidth=it.weight||3;
      if(it.dash)g.setLineDash([(it.weight||3)*3.2,(it.weight||3)*2.6]);
      if(hasPersp(it)){quadPath(g,rectQuad(it));g.stroke();}
      else g.strokeRect(it.x,it.y,it.w,it.h);
      g.setLineDash([]);
      if(it.grid){hasPersp(it)?thirdsQuad(g,it):thirds(g,it);}
    }
    else if(it.t==='pen'){
      g.lineWidth=it.weight||3;g.beginPath();
      smoothPath(g,it.pts);g.stroke();
    }
    else if(it.t==='text'){
      g.font=`600 ${it.size||16}px 'Space Grotesk', sans-serif`;g.textBaseline='top';
      g.fillText(it.txt||'',it.x,it.y);
    }
    g.restore();
  }
}

/* Lay the selected pages out in a tidy grid — no overlap, last row centred */
function mergePages(){
  const chosen=proj().pages.filter(p=>pSel.has(p.id));
  if(chosen.length<2){toast('Select at least two pages');return;}
  if(!confirm('Merge '+chosen.length+' pages into one?\n\nEverything drawn on them is kept and laid out side by side.'))return;

  pushHist('Merge pages');

  // measure each page's content
  const metas=chosen.map(pg=>{
    if(!pg.items.length)return{pg,x:0,y:0,w:600,h:400,empty:true};
    let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
    pg.items.forEach(it=>{const b=bbox(it);
      x0=Math.min(x0,b.x);y0=Math.min(y0,b.y);
      x1=Math.max(x1,b.x+b.w);y1=Math.max(y1,b.y+b.h);});
    return{pg,x:x0,y:y0,w:x1-x0,h:y1-y0};
  });

  const n=metas.length;
  const cols=n<=2?n:Math.ceil(Math.sqrt(n));
  const rows=Math.ceil(n/cols);
  const cellW=Math.max(...metas.map(m=>m.w))*1.06;
  const cellH=Math.max(...metas.map(m=>m.h))*1.06;
  const gap=Math.max(cellW,cellH)*0.06;

  const merged=newPage();
  merged.name=(chosen[0].pg?'':'')+'Merged';
  merged.kind=chosen.find(p=>p.kind)?.kind||null;

  metas.forEach((m,i)=>{
    const r=Math.floor(i/cols);
    const inRow=Math.min(cols,n-r*cols);          // how many in this row
    const c=i-r*cols;
    const rowW=inRow*cellW+(inRow-1)*gap;
    const totalW=cols*cellW+(cols-1)*gap;
    const rowOffset=(totalW-rowW)/2;              // centre a short final row
    const cx=rowOffset+c*(cellW+gap)+(cellW-m.w)/2;
    const cy=r*(cellH+gap)+(cellH-m.h)/2;
    const dx=cx-m.x, dy=cy-m.y;
    m.pg.items.forEach(it=>{
      const cp=JSON.parse(JSON.stringify(it));
      cp.id=uid();
      moveItem(cp,dx,dy);
      merged.items.push(cp);
    });
    (m.pg.refs||[]).forEach(src=>{if(!merged.refs.includes(src))merged.refs.push(src);});
  });

  const firstIdx=proj().pages.findIndex(p=>pSel.has(p.id));
  proj().pages=proj().pages.filter(p=>!pSel.has(p.id));
  proj().pages.splice(firstIdx,0,merged);
  pageIdx=firstIdx;

  exitPSel();
  sel=null;
  noHist=true;save();noHist=false;histInit();
  renderThumbs();fitPage();draw();syncEmpty();showOpts();syncProgress();
  if(typeof renderRefs==='function')renderRefs();
  toast(n+' pages merged');
}

/* ==========================================================
   PDF import — one PDF page becomes one board page
   ========================================================== */
const pdfFile=document.createElement('input');
pdfFile.type='file';pdfFile.accept='application/pdf,.pdf';
pdfFile.style.display='none';document.body.appendChild(pdfFile);
document.getElementById('btnPdf').onclick=()=>pdfFile.click();
document.getElementById('emptyPdf').onclick=()=>pdfFile.click();

let pdfLibP=null;
function loadPdfLib(){
  if(window.pdfjsLib)return Promise.resolve(window.pdfjsLib);
  if(pdfLibP)return pdfLibP;
  pdfLibP=new Promise((res,rej)=>{
    const sc=document.createElement('script');
    sc.src='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
    sc.onload=()=>{
      try{
        window.pdfjsLib.GlobalWorkerOptions.workerSrc=
          'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
        res(window.pdfjsLib);
      }catch(e){rej(e);}
    };
    sc.onerror=()=>rej('load failed');
    document.head.appendChild(sc);
  });
  return pdfLibP;
}

function pdfStatus(txt,pct){
  const box=document.getElementById('pdfProg');
  document.getElementById('pdfTxt').textContent=txt;
  document.getElementById('pdfFill').style.width=(pct||0)+'%';
  box.classList.add('on');
}
function pdfDone(){document.getElementById('pdfProg').classList.remove('on');}

pdfFile.onchange=async e=>{
  const f=e.target.files[0];e.target.value='';
  if(!f)return;

  pdfStatus('Loading PDF engine…',4);
  let lib;
  try{lib=await loadPdfLib();}
  catch(err){
    pdfDone();
    toast('PDF import needs internet the first time — connect and retry');
    return;
  }

  try{
    const buf=await f.arrayBuffer();
    pdfStatus('Reading PDF…',8);
    const doc=await lib.getDocument({data:buf}).promise;
    const n=doc.numPages;

    if(!confirm('Import '+n+' page'+(n===1?'':'s')+' from "'+f.name+'"?\n\nEach PDF page becomes its own board page.')){
      pdfDone();return;
    }

    pushHist('Import PDF');
    const startCount=proj().pages.length;
    const firstEmpty = startCount===1 && !proj().pages[0].items.length;

    for(let i=1;i<=n;i++){
      pdfStatus('Importing page '+i+' of '+n+'…',Math.round(i/n*100));
      const pg=await doc.getPage(i);
      let vp=pg.getViewport({scale:1});
      const target=1800;                                  // long edge in px
      const sc=Math.min(target/Math.max(vp.width,vp.height),3);
      vp=pg.getViewport({scale:sc});
      const c=document.createElement('canvas');
      c.width=Math.round(vp.width);c.height=Math.round(vp.height);
      const g=c.getContext('2d');
      g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);
      await pg.render({canvasContext:g,viewport:vp}).promise;
      const src=c.toDataURL('image/jpeg',0.85);

      const target_pg = (firstEmpty&&i===1) ? proj().pages[0] : (proj().pages.push(newPage()),proj().pages[proj().pages.length-1]);
      target_pg.name='PDF '+i;
      const scale=Math.min(900/c.width,650/c.height,1);
      target_pg.items.push({
        id:uid(),t:'img',src,
        x:-c.width*scale/2, y:-c.height*scale/2,
        w:c.width*scale, h:c.height*scale, lock:true
      });
      getImg(src);
      await new Promise(r=>setTimeout(r,0));              // let the UI breathe
    }

    pageIdx = firstEmpty ? 0 : startCount;
    sel=null;
    noHist=true;save();noHist=false;histInit();
    renderThumbs();fitPage();draw();syncEmpty();showOpts();syncProgress();
    pdfDone();
    toast(n+' page'+(n===1?'':'s')+' imported');
  }catch(err){
    pdfDone();
    toast('Could not read that PDF');
  }
};

const importFile=document.createElement('input');
importFile.type='file';importFile.accept='application/json,.json';

importFile.onchange=e=>{
  const f=e.target.files[0];e.target.value='';
  if(!f)return;
  const fr=new FileReader();
  fr.onload=()=>{
    try{
      const p=JSON.parse(fr.result);
      // ---- full app backup (everything) ----
      if(p&&Array.isArray(p.projects)&&p.playbook){
        if(!confirm('Restore FULL backup?\n\nThis replaces all current projects and the Playbook.'))return;
        S=p;
        if(!S.playbook)S.playbook={rooms:[],shots:[],notes:[]};
        if(!S.playbook.notes)S.playbook.notes=[];
        if(!S.projects.find(x=>x.id===S.cur))S.cur=S.projects[0].id;
        pageIdx=0;sel=null;curRoom=null;lastRoom=null;pbRoom=null;
        noHist=true;save();noHist=false;histInit();gInit();
        scrim.classList.remove('on');
        syncName();renderThumbs();draw();syncEmpty();showOpts();syncProgress();
        if(mode==='inspo'||mode==='pb')renderInspo();
        if(typeof renderRefs==='function')renderRefs();
        S.projects.forEach(pr=>pr.pages.forEach(pg=>pg.items.forEach(it=>{if(it.t==='img')getImg(it.src);})));
        toast('Everything restored — '+S.projects.length+' projects');
        return;
      }

      // ---- playbook backup — merge angles AND reminders ----
      if(p&&!p.pages&&(Array.isArray(p.shots)||Array.isArray(p.notes)||Array.isArray(p.rooms))){
        (p.rooms||[]).forEach(r=>{if(!S.playbook.rooms.includes(r))S.playbook.rooms.push(r);});
        const have=new Set(S.playbook.shots.map(x=>x.id));
        let added=0;
        (p.shots||[]).forEach(x=>{
          if(!x||!x.src)return;
          if(!x.id||have.has(x.id))x.id=uid();
          S.playbook.shots.push({id:x.id,src:x.src,room:x.room||null});added++;
        });
        if(!S.playbook.notes)S.playbook.notes=[];
        const haveN=new Set(S.playbook.notes.map(x=>x.text));
        let addedN=0;
        (p.notes||[]).forEach(x=>{
          if(!x||!x.text)return;
          if(haveN.has(x.text))return;                 // skip duplicates by text
          S.playbook.notes.push({id:uid(),text:x.text,done:!!x.done,pics:Array.isArray(x.pics)?x.pics:[]});
          addedN++;
        });
        noHist=true;save();noHist=false;
        scrim.classList.remove('on');
        toast('Playbook merged: '+added+' angles, '+addedN+' reminders');
        if(mode==='pb'||mode==='inspo')renderInspo();
        return;
      }
      if(!p||!Array.isArray(p.pages))throw 0;
      p.id=uid();
      p.name=(p.name||'Imported project')+'';
      if(!p.inspo)p.inspo=[];
      if(!p.links)p.links=[];
      if(!p.rooms)p.rooms=DEFAULT_ROOMS.slice();
      p.inspo=p.inspo.map(x=>typeof x==='string'?{id:uid(),src:x,room:null}:x);
      p.pages.forEach(pg=>{
        if(!pg.id)pg.id=uid();
        if(!pg.view)pg.view={x:0,y:0,z:1};
        if(!pg.items)pg.items=[];
        if(!pg.refs)pg.refs=[];
        pg.items.forEach(it=>{
          if(it.color==='#E4533A'||it.color==='#FF6B4A')it.color='#FF3B30';
        });
      });
      S.projects.push(p);
      S.cur=p.id;pageIdx=0;sel=null;curRoom=null;lastRoom=null;
      noHist=true;save();noHist=false;histInit();
      scrim.classList.remove('on');
      syncName();renderThumbs();draw();syncEmpty();showOpts();
      p.pages.forEach(pg=>pg.items.forEach(it=>{if(it.t==='img')getImg(it.src);}));
      toast('Imported "'+p.name+'"');
    }catch(err){toast('Not a valid Shotboard backup');}
  };
  fr.readAsText(f);
};

function renderPage(pg,maxW){
  const c=document.createElement('canvas');
  if(!pg.items.length){c.width=1200;c.height=850;const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);return c;}
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  for(const it of pg.items){const b=bbox(it);x0=Math.min(x0,b.x);y0=Math.min(y0,b.y);x1=Math.max(x1,b.x+b.w);y1=Math.max(y1,b.y+b.h);}
  const pad=44;
  const w=(x1-x0)+pad*2,h=(y1-y0)+pad*2;
  const s=Math.min(maxW/w,2.4);
  c.width=Math.round(w*s);c.height=Math.round(h*s);
  const g=c.getContext('2d');
  g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);
  g.save();g.scale(s,s);g.translate(-x0+pad,-y0+pad);
  paintInto(g,pg.items);
  g.restore();
  return c;
}

function liquify(el){
  if(!el||el._liq)return;
  const d=document.createElement('div');d.className='liq';
  el.prepend(d);el._liq=d;
}
function liqMove(el,btn,animate){
  if(!el||!el._liq||!btn)return;
  const liq=el._liq;
  const cr=el.getBoundingClientRect(),br=btn.getBoundingClientRect();
  const nl=br.left-cr.left, nw=br.width;
  if(animate===false||!liq._set){
    liq.style.transition='none';
    liq.style.left=nl+'px';liq.style.width=nw+'px';
    liq._set=1;void liq.offsetWidth;liq.style.transition='';
    return;
  }
  const ol=parseFloat(liq.style.left)||0, ow=parseFloat(liq.style.width)||0;
  const L=Math.min(ol,nl), R=Math.max(ol+ow,nl+nw);
  liq.style.left=L+'px';liq.style.width=(R-L)+'px';       // stretch across both
  clearTimeout(liq._t);
  liq._t=setTimeout(()=>{liq.style.left=nl+'px';liq.style.width=nw+'px';},150); // settle
}

  liqMove(viewswEl,viewswEl.querySelector('.vsw.on'));
  const pbNotes = iview==='pb' && pbView==='notes';
  const showLinks = iview==='links';
  const showRooms = iview==='rooms' && !curRoom;
  const showPbRooms = iview==='pb' && pbView==='angles' && !pbRoom;
  const showPbPhotos = iview==='pb' && pbView==='angles' && !!pbRoom;
  document.getElementById('notesWrap').classList.toggle('on',pbNotes);

  document.getElementById('linkWrap').classList.toggle('on',showLinks);

  document.getElementById('crumb').classList.toggle('on', (iview==='rooms'&&!!curRoom)||showPbPhotos);
  colLabel();
  if(pbNotes){document.getElementById('inspoEmpty').classList.add('hide');renderNotes();return;}
  if(showLinks){document.getElementById('inspoEmpty').classList.add('hide');renderLinks();}
  else if(showPbRooms){document.getElementById('inspoEmpty').classList.add('hide');renderPbRooms();}

    c.onclick=()=>{
      if(justSel){justSel=false;return;}
      if(selMode){toggleSel(item);return;}
      lbEdit=null;openLb(list,i);
    };

    // reorder within the master list
    const move=(from,to)=>{
      const L=proj().inspo;
      const a=L.indexOf(list[from]), b=L.indexOf(list[to]);
      if(a<0||b<0)return;
      const[m]=L.splice(a,1);L.splice(b,0,m);
      noHist=true;save();noHist=false;renderInspo();
    };
    c.ondragstart=e=>{e.dataTransfer.setData('text/plain',i);c.classList.add('drag');};
    c.ondragend=()=>c.classList.remove('drag');
    c.ondragover=e=>e.preventDefault();
    c.ondrop=e=>{e.preventDefault();const f=+e.dataTransfer.getData('text/plain');if(f!==i)move(f,i);};
    let lp=null,moved=false,sx=0,sy=0;
    c.addEventListener('pointerdown',e=>{
      moved=false;sx=e.clientX;sy=e.clientY;
      clearTimeout(lp);
      lp=setTimeout(()=>{if(!moved)enterSel(item);},430);
    });
    c.addEventListener('pointermove',e=>{
      if(Math.hypot(e.clientX-sx,e.clientY-sy)>9){moved=true;clearTimeout(lp);}
    });
    ['pointerup','pointercancel','pointerleave'].forEach(ev=>
      c.addEventListener(ev,()=>clearTimeout(lp)));
    colDivs[i%nCols].appendChild(c);
  });
}

function renderNotes(){
  const L=document.getElementById('notesList');

  L.innerHTML='';
  document.getElementById('inspoCount').textContent=
    N.filter(n=>n.done).length+' / '+N.length+' checked';
  if(!N.length){
    L.innerHTML='<div class="emptyt" style="padding:26px 4px;text-align:center">'+
      'Nothing here yet.<br>Add the things you keep forgetting — or start from a suggested list.'+
      '</div>';

      NOTE_SEED.forEach(t=>S.playbook.notes.push({id:uid(),text:t,done:false}));

      toast('Added — edit or delete any of them');
    };
    L.appendChild(seed);

  }
  N.forEach((n,i)=>{
    const d=document.createElement('div');
    d.className='note'+(n.done?' done':'');
    d.style.animationDelay=Math.min(i*18,200)+'ms';
    d.draggable=true;

    const grip=document.createElement('button');
    grip.className='notedrag';grip.textContent='⠿';

    grip.setAttribute('draggable','false');
    d.appendChild(grip);

    const box=document.createElement('button');
    box.className='notebox';box.textContent='✓';
    box.setAttribute('draggable','false');
    box.addEventListener('pointerdown',ev=>ev.stopPropagation());
    box.addEventListener('click',ev=>{
      ev.stopPropagation();
      n.done=!n.done;noHist=true;save();noHist=false;renderNotes();
    });
    d.appendChild(box);

    const t=document.createElement('div');
    t.className='notetxt';t.textContent=n.text;
    t.addEventListener('click',ev=>{
      ev.stopPropagation();
      const v=prompt('Reminder',n.text);
      if(v===null)return;
      if(!v.trim()){
        if(!confirm('Empty text — delete this reminder?'))return;
        S.playbook.notes=S.playbook.notes.filter(x=>x.id!==n.id);
      }else n.text=v.trim();
      noHist=true;save();noHist=false;renderNotes();
    });
    d.appendChild(t);

    const del=document.createElement('button');
    del.className='noteact';del.textContent='✕';
    del.title='Delete reminder';
    del.setAttribute('draggable','false');
    del.addEventListener('pointerdown',ev=>{ev.stopPropagation();});
    del.addEventListener('click',ev=>{
      ev.stopPropagation();ev.preventDefault();
      const label=n.text.length>60?n.text.slice(0,60)+'…':n.text;

      S.playbook.notes=S.playbook.notes.filter(x=>x.id!==n.id);
      noHist=true;save();noHist=false;renderNotes();
      toast('Reminder deleted');
    });
    d.appendChild(del);

    if(!n.pics)n.pics=[];
    const strip=document.createElement('div');strip.className='notepics';
    n.pics.forEach((src,pi)=>{
      const w=document.createElement('div');w.className='notepic';
      w.style.animationDelay=Math.min(pi*30,150)+'ms';
      const im=document.createElement('img');im.src=src;im.loading='lazy';
      w.appendChild(im);
      const ed=document.createElement('button');ed.className='pedit';ed.textContent='✎';
      ed.onclick=ev=>{ev.stopPropagation();openAnno(src,out=>{n.pics[pi]=out;noHist=true;save();noHist=false;renderNotes();});};
      w.appendChild(ed);
      const px=document.createElement('button');px.className='pdel';px.textContent='✕';
      px.onclick=ev=>{
        ev.stopPropagation();
        if(!confirm('Remove this photo?'))return;
        pushHist('Delete reminder photo');
        n.pics.splice(pi,1);noHist=true;save();noHist=false;renderNotes();
      };
      w.appendChild(px);
      im.onclick=()=>openLbEditable(
        n.pics.map((s2,k)=>({id:'np'+k,src:s2})),pi,
        {note:n}
      );
      strip.appendChild(w);
    });
    const add=document.createElement('button');
    add.className='noteadd';add.textContent='+ Photo';
    add.setAttribute('draggable','false');
    add.addEventListener('pointerdown',ev=>ev.stopPropagation());
    add.addEventListener('click',ev=>{ev.stopPropagation();noteTarget=n;noteFile.click();});
    strip.appendChild(add);
    d.appendChild(strip);

    const move=(from,to)=>{
      const A=S.playbook.notes;
      const[m]=A.splice(from,1);A.splice(to,0,m);
      noHist=true;save();noHist=false;renderNotes();
    };

    grip.addEventListener('pointerdown',ev=>{
      ev.preventDefault();ev.stopPropagation();
      grip.setPointerCapture(ev.pointerId);
      const listEl=document.getElementById('notesList');
      const rows=[...listEl.children];
      const startY=ev.clientY;
      const myRect=d.getBoundingClientRect();
      let target=i;
      d.classList.add('lift');
      listEl.classList.add('reorder');

      const onMove=e2=>{
        const dy=e2.clientY-startY;
        d.style.transform='translateY('+dy+'px) scale(1.015)';
        const cy=myRect.top+myRect.height/2+dy;
        let idx=i;
        rows.forEach((r,k)=>{
          if(r===d)return;
          const rr=r.getBoundingClientRect();
          if(cy>rr.top+rr.height/2)idx=Math.max(idx,k);
          if(cy<rr.top+rr.height/2)idx=Math.min(idx,k);
        });
        target=idx;
        // live preview: shift the rows we'd displace
        rows.forEach((r,k)=>{
          if(r===d){return;}
          let shift=0;
          if(i<target&&k>i&&k<=target)shift=-myRect.height-8;
          if(i>target&&k>=target&&k<i)shift=myRect.height+8;
          r.style.transform=shift?'translateY('+shift+'px)':'';
        });
      };
      const onUp=()=>{
        grip.removeEventListener('pointermove',onMove);
        grip.removeEventListener('pointerup',onUp);
        grip.removeEventListener('pointercancel',onUp);
        listEl.classList.remove('reorder');
        rows.forEach(r=>{r.style.transform='';});
        d.classList.remove('lift');d.style.transform='';
        if(target!==i)move(i,target);
      };
      grip.addEventListener('pointermove',onMove);
      grip.addEventListener('pointerup',onUp);
      grip.addEventListener('pointercancel',onUp);
    });
    d.dataset.i=i;
    d.ondragstart=e=>{
      if(e.target!==d){e.preventDefault();return;}
      e.dataTransfer.setData('text/plain',i);d.style.opacity='.4';
    };
    d.ondragend=()=>{d.style.opacity='';};
    d.ondragover=e=>e.preventDefault();
    d.ondrop=e=>{e.preventDefault();const f=+e.dataTransfer.getData('text/plain');if(f!==i)move(f,i);};

    L.appendChild(d);
  });
}

let noteTarget=null;
const noteFile=document.createElement('input');
noteFile.type='file';noteFile.accept='image/*';noteFile.multiple=true;
noteFile.style.display='none';document.body.appendChild(noteFile);
noteFile.onchange=async e=>{
  const files=[...e.target.files];e.target.value='';
  if(!noteTarget||!files.length)return;
  if(!noteTarget.pics)noteTarget.pics=[];
  for(const f of files){
    try{noteTarget.pics.push(await shrink(f,1300));}

/* ---------- Annotation editor (mark up a reminder photo) ---------- */
const annoEl=document.getElementById('anno');
const annoCv=document.getElementById('annoCv');
const actx=annoCv.getContext('2d');
let annoImg=null,annoStrokes=[],annoTool='pen',annoColor='#FF3B30',annoDone=null,annoAct=null;

function annoDraw(){
  if(!annoImg)return;
  actx.clearRect(0,0,annoCv.width,annoCv.height);
  actx.drawImage(annoImg,0,0,annoCv.width,annoCv.height);
  const w=Math.max(3,annoCv.width*0.006);
  const all=annoAct?annoStrokes.concat([annoAct]):annoStrokes;
  for(const st of all){
    actx.save();
    actx.strokeStyle=st.c;actx.fillStyle=st.c;
    actx.lineWidth=w;actx.lineCap='round';actx.lineJoin='round';
    if(st.t==='pen'){
      actx.beginPath();
      st.p.forEach((pt,i)=>i?actx.lineTo(pt.x,pt.y):actx.moveTo(pt.x,pt.y));
      actx.stroke();
    }else if(st.t==='rect'){
      actx.strokeRect(st.x1,st.y1,st.x2-st.x1,st.y2-st.y1);
    }else if(st.t==='arrow'){
      const dx=st.x2-st.x1,dy=st.y2-st.y1,len=Math.hypot(dx,dy)||1;
      const a=Math.atan2(dy,dx),h=Math.min(Math.max(w*5.4,18),len*0.5),sp=0.55;
      actx.beginPath();actx.moveTo(st.x1,st.y1);actx.lineTo(st.x2,st.y2);actx.stroke();
      actx.beginPath();
      actx.moveTo(st.x2-h*Math.cos(a-sp),st.y2-h*Math.sin(a-sp));
      actx.lineTo(st.x2,st.y2);
      actx.lineTo(st.x2-h*Math.cos(a+sp),st.y2-h*Math.sin(a+sp));
      actx.stroke();
    }
    actx.restore();
  }
}
function annoPt(e){
  const r=annoCv.getBoundingClientRect();
  return{x:(e.clientX-r.left)*(annoCv.width/r.width),
         y:(e.clientY-r.top)*(annoCv.height/r.height)};
}
annoCv.addEventListener('pointerdown',e=>{
  annoCv.setPointerCapture(e.pointerId);
  const p=annoPt(e);
  annoAct = annoTool==='pen'
    ? {t:'pen',c:annoColor,p:[p]}
    : {t:annoTool,c:annoColor,x1:p.x,y1:p.y,x2:p.x,y2:p.y};
  annoDraw();
});
annoCv.addEventListener('pointermove',e=>{
  if(!annoAct)return;
  const p=annoPt(e);
  if(annoAct.t==='pen')annoAct.p.push(p);
  else{annoAct.x2=p.x;annoAct.y2=p.y;}
  annoDraw();
});
const annoEnd=()=>{
  if(!annoAct)return;
  const a=annoAct;annoAct=null;
  const big = a.t==='pen' ? a.p.length>1 : Math.hypot(a.x2-a.x1,a.y2-a.y1)>6;
  if(big)annoStrokes.push(a);
  annoDraw();
};
annoCv.addEventListener('pointerup',annoEnd);
annoCv.addEventListener('pointercancel',annoEnd);

function openAnno(src,onSave){
  annoDone=onSave;annoStrokes=[];annoAct=null;
  const im=new Image();
  im.onload=()=>{
    annoImg=im;
    const max=1500;
    const sc=Math.min(max/im.width,max/im.height,1);
    annoCv.width=Math.round(im.width*sc);
    annoCv.height=Math.round(im.height*sc);
    annoDraw();
    annoEl.classList.add('on');
  };
  im.src=src;
}
document.getElementById('annoCancel').onclick=()=>{annoEl.classList.remove('on');annoDone=null;};
document.getElementById('annoUndo').onclick=()=>{annoStrokes.pop();annoDraw();};
document.getElementById('annoSave').onclick=()=>{
  const out=annoCv.toDataURL('image/jpeg',0.88);
  annoEl.classList.remove('on');
  if(annoDone)annoDone(out);
  annoDone=null;
  toast('Marked up');
};
[['annoPen','pen'],['annoArrow','arrow'],['annoRect','rect']].forEach(([id,t])=>{
  document.getElementById(id).onclick=()=>{
    annoTool=t;
    ['annoPen','annoArrow','annoRect'].forEach(x=>
      document.getElementById(x).classList.toggle('on',x===id));

/* ---------- Links (videos, posts, references) ---------- */
function ytId(u){
  const m=u.match(/(?:youtu\.be\/|v=|shorts\/|embed\/|live\/)([\w-]{11})/);
  return m?m[1]:null;
}
function platformOf(u){
  try{
    const h=new URL(u).hostname.replace('www.','');
    if(h.includes('youtu'))return'YouTube';
    if(h.includes('instagram'))return'Instagram';
    if(h.includes('tiktok'))return'TikTok';
    if(h.includes('vimeo'))return'Vimeo';
    if(h.includes('pinterest')||h.includes('pin.it'))return'Pinterest';
    return h;
  }catch(e){return'Link';}
}
function hostOf(u){try{return new URL(u).hostname.replace('www.','');}catch(e){return u;}}

function addLinkFlow(){
  let u=prompt('Paste the link (YouTube, Instagram, TikTok…)');
  if(!u||!u.trim())return;
  u=u.trim();
  if(!/^https?:\/\//i.test(u))u='https://'+u;
  try{new URL(u);}catch(e){toast('That does not look like a link');return;}
  const yid=ytId(u);
  const entry={
    id:uid(),url:u,
    platform:platformOf(u),
    title:hostOf(u),
    thumb:yid?('https://i.ytimg.com/vi/'+yid+'/hqdefault.jpg'):null,
    fetched:false
  };
  proj().links.unshift(entry);
  noHist=true;save();noHist=false;
  renderLinks();
  fetchLinkMeta(entry);
}

async function fetchLinkMeta(entry){
  try{
    const r=await fetch('https://noembed.com/embed?url='+encodeURIComponent(entry.url));
    const j=await r.json();
    let changed=false;
    if(j&&j.title){entry.title=j.title;changed=true;}
    if(j&&j.thumbnail_url&&!entry.thumb){entry.thumb=j.thumbnail_url;changed=true;}
    entry.fetched=true;
    if(changed){
      noHist=true;save();noHist=false;
      if(mode==='inspo'&&iview==='links')renderLinks();
    }
  }catch(e){
    entry.fetched=true;
    // offline or blocked — card keeps the domain as its title; user can rename
  }
}

/* ---------- Lightbox with slide animation ---------- */
const lb=document.getElementById('lightbox');
const track=document.getElementById('lbTrack');
const slides=[document.getElementById('lbA'),document.getElementById('lbB'),document.getElementById('lbC')];

function fillSlides(){
  const n=lbList.length;
  if(!n)return;
  const Wl=lb.clientWidth||window.innerWidth;
  const at=k=>lbList[((lbIdx+k)%n+n)%n];
  slides[0].src=n>1?at(-1).src:'';
  slides[1].src=at(0).src;
  slides[2].src=n>1?at(1).src:'';
  track.classList.remove('anim');
  track.style.transform='translateX('+(-Wl)+'px)';
  document.getElementById('lbPos').textContent=(lbIdx+1)+' / '+n;
  syncLbRoom();
}
function syncLbRoom(){
  const it=lbList[lbIdx];
  document.getElementById('lbRoom').textContent=it&&it.room?it.room:'Tag space';
}
let lbEdit=null;   // {get:()=>src, set:(newSrc)=>void} when the current list is editable
function openLbEditable(list,i,editor){
  lbEdit=editor;
  openLb(list,i);
}
function openLb(list,i){
  lbList=list.slice();lbIdx=i;
  lb.classList.add('on');
  lb.classList.add('entering');
  clearTimeout(lb._ent);
  lb._ent=setTimeout(()=>lb.classList.remove('entering'),400);
  fillSlides();
  syncLbMark();
}
function syncLbMark(){
  const b=document.getElementById('lbMark');
  if(b)b.classList.toggle('on',!!lbEdit);
}
function stepLb(d){
  const n=lbList.length;
  if(n<2){if(!n)lb.classList.remove('on');return;}
  track.classList.add('anim');
  track.style.transform='translateX('+(-lb.clientWidth-d*lb.clientWidth)+'px)';
  const done=()=>{
    track.removeEventListener('transitionend',done);
    lbIdx=((lbIdx+d)%n+n)%n;
    fillSlides();
  };
  track.addEventListener('transitionend',done);
  setTimeout(()=>{if(track.classList.contains('anim'))done();},380);
}
document.getElementById('lbNext').onclick=()=>stepLb(1);
document.getElementById('lbPrev').onclick=()=>stepLb(-1);

/* drag-to-swipe: image follows the finger, next one trails in */
let sx0=null,sy0=null,dragging=false,axis=null;
lb.addEventListener('touchstart',e=>{
  if(e.touches.length!==1)return;
  sx0=e.touches[0].clientX;sy0=e.touches[0].clientY;
  axis=null;dragging=false;
  track.classList.remove('anim');
},{passive:true});
lb.addEventListener('touchmove',e=>{
  if(sx0===null||e.touches.length!==1)return;
  const dx=e.touches[0].clientX-sx0, dy=e.touches[0].clientY-sy0;
  if(!axis){
    if(Math.abs(dx)<6&&Math.abs(dy)<6)return;
    axis=Math.abs(dx)>Math.abs(dy)?'x':'y';
  }
  if(axis!=='x'||lbList.length<2)return;
  dragging=true;
  track.style.transform='translateX('+(-lb.clientWidth+dx)+'px)';
},{passive:true});
lb.addEventListener('touchend',e=>{
  if(sx0===null)return;
  const dx=e.changedTouches[0].clientX-sx0;
  const wasDrag=dragging;
  sx0=null;sy0=null;dragging=false;
  if(!wasDrag||lbList.length<2)return;
  if(Math.abs(dx)>lb.clientWidth*0.22)stepLb(dx<0?1:-1);
  else{track.classList.add('anim');track.style.transform='translateX('+(-lb.clientWidth)+'px)';}
},{passive:true});

let urDrag=null;
urGrip.addEventListener('pointerdown',e=>{
  e.preventDefault();e.stopPropagation();
  urGrip.setPointerCapture(e.pointerId);
  const st=document.getElementById('stage').getBoundingClientRect();
  urDrag={sy:e.clientY,rect:st,h:urEl.offsetHeight,
    startTop:urEl.getBoundingClientRect().top-st.top};
});
urGrip.addEventListener('pointermove',e=>{
  if(!urDrag)return;
  const t=Math.max(8,Math.min(urDrag.rect.height-urDrag.h-8,
    urDrag.startTop+(e.clientY-urDrag.sy)));
  urEl.style.top=t+'px';urEl.style.bottom='auto';
});
function urEnd(){
  if(!urDrag)return;
  const st=urDrag.rect;
  const cur=urEl.getBoundingClientRect();
  const centerY=cur.top-st.top+cur.height/2;
  const tl=centerY<st.height/2;
  urEl.classList.toggle('tl',tl);
  urEl.style.top='';urEl.style.bottom='';
  try{localStorage.setItem('sb.urpos',tl?'tl':'bl');}catch(err){}
  urDrag=null;
  syncOptsInset();
}
function syncOptsInset(){
  const o=document.querySelector('.opts');
  if(o)o.style.left=urEl.classList.contains('tl')?'76px':'156px';
}
urGrip.addEventListener('pointerup',urEnd);
urGrip.addEventListener('pointercancel',urEnd);

document.getElementById('btnSave').onclick=()=>{
  flushSave(ok=>toast(ok?'Saved to device':'SAVE FAILED — export a JSON backup now'));
};
document.addEventListener('visibilitychange',()=>{
  if(document.hidden&&typeof flushSave==='function')flushSave();
});
window.addEventListener('pagehide',()=>{
  if(typeof flushSave==='function')flushSave();
});

document.getElementById('btnUndo').onclick=doUndo;
document.getElementById('btnRedo').onclick=doRedo;

window.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT')return;
  if(lb.classList.contains('on')){
    if(e.key==='ArrowRight')stepLb(1);
    if(e.key==='ArrowLeft')stepLb(-1);
    if(e.key==='Escape')lb.classList.remove('on');
    return;
  }
  if(mode==='inspo')return;
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='z'){e.preventDefault();e.shiftKey?doRedo():doUndo();return;}
  if((e.key==='Backspace'||e.key==='Delete')&&sel){
    page().items=page().items.filter(i=>i.id!==sel);sel=null;save();draw();renderThumbs();syncEmpty();showOpts();e.preventDefault();
  }
  const map={v:'select',a:'arrow',r:'rect',p:'pen',t:'text',m:'mark',e:'erase',h:'pan'};
  if(map[e.key.toLowerCase()]){
    const b=document.querySelector('.tool[data-tool="'+map[e.key.toLowerCase()]+'"]');
    if(b)b.click();
  }
});

document.addEventListener('gesturestart',e=>e.preventDefault());
document.addEventListener('dblclick',e=>e.preventDefault());
window.addEventListener('resize',()=>{

    liqMove(modeswEl,modeswEl.querySelector('.mode.on'),false);

  if(lb.classList.contains('on'))setTimeout(fillSlides,80);
});
window.addEventListener('orientationchange',()=>{
  setTimeout(resize,220);
  if(lb.classList.contains('on'))setTimeout(fillSlides,260);
});

/* ==========================================================
   Auto-update (service worker)
   ========================================================== */
let swReg=null,waitingSW=null;

function showUpdateBar(){
  const b=document.getElementById('updBar');
  if(b)b.classList.add('on');
}
document.getElementById('updLater').onclick=()=>
  document.getElementById('updBar').classList.remove('on');
document.getElementById('updGo').onclick=()=>{
  // flush current work before the reload — data lives in IndexedDB, untouched by SW updates
  if(typeof flushSave==='function')flushSave();
  setTimeout(()=>{
    if(waitingSW){waitingSW.postMessage({type:'SKIP_WAITING'});}
    else location.reload();
  },160);
};

function watchSW(reg){
  swReg=reg;
  if(reg.waiting){waitingSW=reg.waiting;showUpdateBar();}
  reg.addEventListener('updatefound',()=>{
    const nw=reg.installing;
    if(!nw)return;
    nw.addEventListener('statechange',()=>{
      if(nw.state==='installed'&&navigator.serviceWorker.controller){
        waitingSW=nw;showUpdateBar();
      }
    });
  });
}

if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('sw.js').then(reg=>{
      watchSW(reg);
      reg.update();                                   // check on every launch
      setInterval(()=>reg.update(),30*60*1000);       // and every 30 min while open
    }).catch(()=>{});
  });
  let reloaded=false;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{
    if(reloaded)return;reloaded=true;location.reload();
  });
  document.addEventListener('visibilitychange',()=>{
    if(!document.hidden&&swReg)swReg.update();        // check when you come back to the app
  });
}

/* ==========================================================
   IndexedDB storage (GBs) with localStorage migration + fallback
   ========================================================== */
let _idb=null;
function idbOpen(){
  return new Promise((res,rej)=>{
    let done=false;
    const fail=e=>{if(!done){done=true;rej(e);}};
    try{
      if(!window.indexedDB){fail('no idb');return;}
      const r=indexedDB.open('shotboard',1);
      const to=setTimeout(()=>fail('timeout'),3000);
      r.onupgradeneeded=()=>{try{r.result.createObjectStore('kv');}catch(e){}};
      r.onsuccess=()=>{clearTimeout(to);if(!done){done=true;_idb=r.result;res();}};
      r.onerror=()=>{clearTimeout(to);fail(r.error);};
      r.onblocked=()=>{clearTimeout(to);fail('blocked');};
    }catch(e){fail(e);}
  });
}
function idbGet(k){
  return new Promise((res,rej)=>{
    const t=_idb.transaction('kv').objectStore('kv').get(k);
    t.onsuccess=()=>res(t.result);
    t.onerror=()=>rej(t.error);
  });
}
function idbSet(k,v){
  return new Promise((res,rej)=>{
    const t=_idb.transaction('kv','readwrite').objectStore('kv').put(v,k);
    t.onsuccess=()=>res();
    t.onerror=()=>rej(t.error);
  });
}

function boot(){
  load();
  if(S.ui&&typeof S.ui.page==='number'){
    pageIdx=Math.max(0,Math.min(S.ui.page,proj().pages.length-1));
  }
  histInit();
  badges();
  syncName();
  renderThumbs();
  resize();
  syncEmpty();
  showOpts();
  syncTrash();
  setMode('board');
  syncProgress();
  setSaveStatus('ok');
  if(typeof syncOptsInset==='function')syncOptsInset();
  if(S.ui&&(S.ui.mode==='inspo'||S.ui.mode==='pb'))setMode(S.ui.mode);
  if(typeof renderRefs==='function')renderRefs();
  S.projects.forEach(p=>p.pages.forEach(pg=>pg.items.forEach(it=>{if(it.t==='img')getImg(it.src);})));
}

(async function(){
  window.__idbOK=false;
  try{await idbOpen();window.__idbOK=true;}catch(e){}
  if(window.__idbOK){
    try{
      const v=await idbGet('state');
      let r=null;
      try{r=localStorage.getItem(DB);}catch(e){}
      if(v&&r&&r.length>v.length){
        // localStorage is richer (e.g. migration missed a session) — take it
        S=JSON.parse(r);await idbSet('state',r);
      }else if(v){
        S=JSON.parse(v);
      }else if(r){
        S=JSON.parse(r);await idbSet('state',r);
      }
    }catch(e){/* fall through to localStorage inside load() */}
  }
  boot();
  // ask the browser to protect this origin's data from eviction
  if(navigator.storage&&navigator.storage.persist){
    navigator.storage.persist().catch(()=>{});
  }
})();
</script>
